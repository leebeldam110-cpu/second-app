<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>London, 1886</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --ground:#E9E4D6; --land:#F4EFE2; --ink:#2A2A33; --ink-soft:#6B6878;
  --water:#9CCBE3; --water-edge:#6FA6C4; --park:#C4DDA6; --park-edge:#9DBE7C;
  --road:#FFFFFF; --road-edge:#CFC4AE; --rail:#8C8698;
  --panel:#FBF8F1; --panel-2:#F0EBDE; --line:rgba(42,42,51,.14);
  --west:#6A4C9C; --lamb:#C8621E; --cut:#A7800A; --china:#C0392B; --bridge:#1F5F86;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121518; --land:#1C2024; --ink:#ECE6D6; --ink-soft:#A29D90;
    --water:#23465A; --water-edge:#3A6883; --park:#27402A; --park-edge:#3C5C3E;
    --road:#3A3F45; --road-edge:#2A2E33; --rail:#77727F;
    --panel:#181B1F; --panel-2:#22262B; --line:rgba(236,230,214,.14);
    --west:#B89BEA; --lamb:#F0A060; --cut:#E6C555; --china:#F07A6C; --bridge:#7EC4EA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121518; --land:#1C2024; --ink:#ECE6D6; --ink-soft:#A29D90;
  --water:#23465A; --water-edge:#3A6883; --park:#27402A; --park-edge:#3C5C3E;
  --road:#3A3F45; --road-edge:#2A2E33; --rail:#77727F;
  --panel:#181B1F; --panel-2:#22262B; --line:rgba(236,230,214,.14);
  --west:#B89BEA; --lamb:#F0A060; --cut:#E6C555; --china:#F07A6C; --bridge:#7EC4EA;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif;overflow:hidden}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bridge);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.mapwrap{position:relative;overflow:hidden;background:var(--ground);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain}
.mapwrap.dragging{cursor:grabbing}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- map ---------- */
.land{fill:var(--land)}
.edge{fill:none;stroke:var(--ink-soft);stroke-width:1.5}
.park{fill:var(--park);stroke:var(--park-edge);stroke-width:1}
.w-edge{fill:none;stroke:var(--water-edge);stroke-linecap:round;stroke-linejoin:round}
.w-fill{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.dock{fill:var(--water);stroke:var(--water-edge);stroke-width:1}
.road-e{fill:none;stroke:var(--road-edge);stroke-linecap:round;stroke-linejoin:round}
.road{fill:none;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round}
.rail{fill:none;stroke:var(--rail);stroke-width:1.6;stroke-dasharray:6 3}
.area{fill-opacity:.13;stroke-width:1.6;stroke-dasharray:7 5}
.bridge-bar{stroke-linecap:butt;fill:none}

.lbl{paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round}
.lbl-area{font:700 13px "Source Sans 3",system-ui,sans-serif;letter-spacing:.2em}
.lbl-river{font:italic 16px "Source Sans 3",system-ui,sans-serif;fill:var(--water-edge);stroke:none;letter-spacing:.4em}
.lbl-park{font:italic 12px "Source Sans 3",system-ui,sans-serif;fill:var(--ink-soft);stroke:var(--park)}
.lbl-street{font:10.5px "Source Sans 3",system-ui,sans-serif;fill:var(--ink-soft);stroke:var(--road);letter-spacing:.03em}
.lbl-place{font:600 13px "Source Sans 3",system-ui,sans-serif;fill:var(--ink)}
.lbl-bridge{font:italic 600 12px "Source Sans 3",system-ui,sans-serif;fill:var(--bridge)}

.pl{cursor:pointer}
.pl .hit{fill:transparent}
.pl .dotm{stroke:var(--land);stroke-width:2}
.pl .ring{fill:none;stroke-width:2.5;opacity:0}
.pl.sel .ring{opacity:1}
.pl .num{fill:var(--land);stroke:var(--bridge);stroke-width:1.8}
.pl .numt{font:700 10px "Source Sans 3",system-ui,sans-serif;fill:var(--bridge);text-anchor:middle}
.pl:hover .lbl-place,.pl.sel .lbl-place{text-decoration:underline}
.pl.dim{opacity:.2}

/* labels appear as you zoom */
.z-2,.z-3,.lbl-street{display:none}
svg.z2 .z-2{display:inline}
svg.z3 .z-2,svg.z3 .z-3{display:inline}
svg.z2 .lbl-street,svg.z3 .lbl-street{display:inline}
svg.filtered .pl:not(.dim).z-2,svg.filtered .pl:not(.dim).z-3,svg.filtered .pl:not(.dim) .z-3{display:inline}
svg.no-rail .L-rail,svg.no-streets .L-streets,svg.no-areas .L-areas{display:none}

/* ---------- chrome ---------- */
.title{position:absolute;top:14px;left:14px;padding:8px 14px 9px;background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;pointer-events:none}
.title h1{margin:0;font:400 30px/1 "IM Fell English SC",Georgia,serif;letter-spacing:.05em}
.title div{font:italic 14px "IM Fell English",Georgia,serif;color:var(--ink-soft)}
.ctrls{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px}
.btn{width:40px;height:40px;display:grid;place-items:center;background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;cursor:pointer;font-size:22px;line-height:1;padding:0}
.btn:hover{background:var(--panel-2)}
.btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.6}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.btn[aria-pressed="true"] svg{stroke:var(--panel)}
.layers{position:absolute;top:14px;right:62px;background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;padding:10px 14px;display:grid;gap:6px;z-index:3}
.layers label{display:flex;align-items:center;gap:9px;cursor:pointer}
.layers input{accent-color:var(--bridge);width:16px;height:16px;margin:0}
.scale{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;padding:5px 10px 4px;pointer-events:none;font-size:12px}
.scale .bar{height:6px;display:flex;border:1px solid var(--ink)}
.scale .bar i{flex:1;background:var(--ink)} .scale .bar i:nth-child(even){background:var(--panel)}
.scale .t{display:flex;justify-content:space-between;gap:12px;margin-top:1px}
.compass{position:absolute;right:14px;bottom:14px;width:44px;height:44px;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:13px;padding:2px 8px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-150%);z-index:4}

/* ---------- panel ---------- */
.panel{background:var(--panel);border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
.detail{padding:16px 18px 14px;border-bottom:1px solid var(--line);flex:none;max-height:55%;overflow:auto}
.detail .cat{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.sw{width:11px;height:11px;border-radius:50%;flex:none}
.detail h2{margin:4px 0 2px;font:400 26px/1.15 "IM Fell English",Georgia,serif;text-wrap:balance}
.detail .meta{font-size:14px;color:var(--ink-soft);font-style:italic}
.detail p{margin:10px 0 0}
.areabtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pbtn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--ink);border-radius:4px;background:transparent;padding:5px 11px;cursor:pointer;font-weight:600;font-size:14px}
.pbtn:hover{background:var(--panel-2)}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.back{margin-top:12px}
.tabbody{flex:1;overflow:auto;min-height:0}
.search{padding:10px 18px;position:sticky;top:0;background:var(--panel);z-index:1;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--land)}
.list{list-style:none;margin:0;padding:0 0 16px}
.list .grp{display:flex;align-items:center;gap:8px;padding:14px 18px 4px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.list .grp em{font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-soft)}
.list button{width:100%;text-align:left;background:none;border:0;padding:6px 18px;cursor:pointer;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline}
.list button:hover,.list button[aria-current="true"]{background:var(--panel-2)}
.list .no{font-size:12px;font-weight:700;color:var(--bridge);text-align:right;font-variant-numeric:tabular-nums}
.list .yr{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.empty{padding:16px 18px;font-style:italic;color:var(--ink-soft)}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .panel{border-left:0;border-top:1.5px solid var(--ink);max-height:44vh;overflow:auto}
  .detail{max-height:none}
  .tabbody{overflow:visible}
  .title h1{font-size:24px}
  .title div{font-size:12px}
}
</style>

<div class="app">

  <aside class="panel" aria-label="Places">

      <ul class="list" id="list"></ul>
    </div>
  </aside>
</div>

 {id:"b-hammer",n:"Hammersmith Bridge",p:[-0.2305,51.4884],k:"works",y:"1827 · rebuilding 1884–87",t:"Tierney Clark's suspension bridge, the first in London, was found unsafe after the Boat Race crowds packed onto it. It is being replaced by Bazalgette's new suspension bridge, which opens in 1887. A temporary crossing serves in the meantime."},
 {id:"b-putney",n:"Putney Bridge",p:[-0.2135,51.4668],k:"road",y:"Opened May 1886",t:"Bazalgette's new granite bridge replaces the rickety wooden one of 1729, which barges kept hitting. It is brand new in 1886. The Boat Race starts just upstream."},
 {id:"b-wands",n:"Wandsworth Bridge",p:[-0.1886,51.4652],k:"road",y:"1873",t:"A plain iron lattice bridge. It was a toll bridge until the Metropolitan Board of Works bought out the tolls in 1880."},
 {id:"b-battrly",n:"Battersea Railway Bridge",p:[-0.1778,51.4765],k:"rail",y:"1863",t:"Brick and iron arches carrying the West London Extension Railway between Chelsea and Clapham Junction."},
 {id:"b-batt",n:"Battersea Bridge",p:[-0.1728,51.4818],k:"works",y:"1771 · rebuilding",t:"The old timber bridge that Whistler painted in his Nocturnes is being replaced. A temporary crossing serves until Bazalgette's iron bridge opens in 1890."},
 {id:"b-albert",n:"Albert Bridge",p:[-0.1665,51.4829],k:"road",y:"1873",t:"R. M. Ordish's cable-stayed toll bridge, pretty but lively. Notices at each end order troops to break step when they cross."},
 {id:"b-chelsea",n:"Chelsea Bridge",p:[-0.1502,51.4847],k:"road",y:"1858",t:"A suspension bridge opened as Victoria Bridge and renamed Chelsea Bridge when people feared its weakness might reflect on the Queen. It has been toll-free since 1879."},
 {id:"b-grosv",n:"Grosvenor Railway Bridge",p:[-0.1470,51.4850],k:"rail",y:"1860, widened 1866",t:"The wide railway bridge carrying the Brighton and Chatham lines into Victoria. It was the first railway bridge across the Thames in central London."},
 {id:"b-vaux",n:"Vauxhall Bridge",p:[-0.1275,51.4882],k:"road",y:"1816",t:"Nine cast-iron arches on stone piers, the first iron bridge across the Thames in London. It links Pimlico and Millbank to Vauxhall, and will be replaced in 1906."},
 {id:"b-lambeth",n:"Lambeth Bridge",p:[-0.1234,51.4945],k:"road",y:"1862",t:"Barlow's cheap, rusting suspension bridge on the old horse-ferry crossing between Lambeth Palace and Millbank. It is steep, narrow and little used by carts."},
 {id:"b-westm",n:"Westminster Bridge",p:[-0.1218,51.5008],k:"road",y:"1862",t:"Thomas Page's seven cast-iron arches, painted green to match the Commons benches. It runs from the foot of the Clock Tower to St Thomas' Hospital and Astley's."},
 {id:"b-hung",n:"Charing Cross Railway Bridge",p:[-0.1198,51.5065],k:"rail",y:"1864",t:"The South Eastern's lattice-girder bridge into Charing Cross. It stands on the brick piers of Brunel's Hungerford footbridge, whose chains went to finish the Clifton suspension bridge. It has a footpath with a halfpenny toll, and Londoners still call it Hungerford Bridge."},
 {id:"b-water",n:"Waterloo Bridge",p:[-0.1170,51.5088],k:"road",y:"Rennie, 1817",t:"Nine granite arches with Doric columns. Canova is said to have called it the noblest bridge in the world. It is notorious for suicides: Thomas Hood's 'The Bridge of Sighs'."},
 {id:"b-blackf",n:"Blackfriars Bridge",p:[-0.1052,51.5096],k:"road",y:"Cubitt, 1869",t:"Five wrought-iron arches on granite piers. The Queen opened it on the same day as Holborn Viaduct. It links the Embankment and Queen Victoria Street to Blackfriars Road and the New Cut."},
 {id:"b-blackrly",n:"Blackfriars Railway Bridge",p:[-0.1044,51.5095],k:"rail",y:"1864",t:"The London, Chatham & Dover's first river crossing, just downstream of the road bridge, carrying trains to Ludgate Hill and Holborn Viaduct."},
 {id:"b-stpauls",n:"St Paul's Railway Bridge",p:[-0.1036,51.5094],k:"rail",y:"New in 1886",t:"A second Chatham & Dover bridge alongside the first, opened in 1886 with the new St Paul's station on the north bank. Today it is Blackfriars station's bridge."},
 {id:"b-southw",n:"Southwark Bridge",p:[-0.0945,51.5087],k:"road",y:"Rennie, 1819",t:"Three enormous cast-iron spans, known as the 'Iron Bridge' in Little Dorrit. It was a toll bridge for decades, so traffic avoided it and it is still the quietest crossing in the City."},
 {id:"b-cannon",n:"Cannon Street Railway Bridge",p:[-0.0915,51.5085],k:"rail",y:"1866",t:"The South Eastern's iron bridge into Cannon Street, whose twin towers face the river."},
 {id:"b-london",n:"London Bridge",p:[-0.0877,51.5079],k:"road",y:"Rennie, 1831",t:"Five granite arches, the busiest crossing in London, with some 20,000 vehicles a day. Below it lies the Pool of London, and ships with masts can go no further upstream."},
 {id:"b-tower",n:"Tower Bridge (building)",p:[-0.0754,51.5055],k:"works",r:1,y:"Begun 21 June 1886",t:"The Prince of Wales lays the foundation stone this summer. For now there are only cofferdams in the river: the bascules and Gothic towers will not be finished until 1894. Draw it as works in progress, or leave it out."},
 {id:"b-subway",n:"Tower Subway",p:[-0.0790,51.5070],k:"under",r:3,y:"1870 (tunnel)",t:"An iron tube under the river from Tower Hill to Vine Street, Bermondsey. It is a foot tunnel with a halfpenny toll, and the only way across below London Bridge without a boat."},
 {id:"b-tunnel",n:"Thames Tunnel",p:[-0.0555,51.5030],k:"under",y:"Brunel, 1843 (tunnel)",t:"Marc and Isambard Brunel's tunnel from Wapping to Rotherhithe. Since 1869 it carries only the trains of the East London Railway."},

 {id:"devilsacre",n:"The Devil's Acre",c:"west",r:2,p:[-0.1335,51.4974],y:"Slum",t:"The rookery of Old Pye Street and Duck Lane, in the shadow of the Abbey. Dickens's journal gave it the name. By 1886 much of it has been replaced by blocks of 'model dwellings', but it is still poor."},

 {id:"pennyfields",n:"Pennyfields",c:"china",r:2,p:[-0.0225,51.5098],y:"1880s onward",t:"The other street of the Limehouse Chinese quarter, with boarding houses, cook-shops and a few gambling and opium rooms."},
 {id:"strangers",n:"Strangers' Home for Asiatics",c:"china",r:2,p:[-0.0262,51.5115],y:"1857",t:"A hostel on West India Dock Road for stranded lascars, Chinese, Malay and African seamen, run by a missionary society."},
 {id:"stanne",n:"St Anne's, Limehouse",c:"china",r:2,a:"l",p:[-0.0322,51.5117],y:"Hawksmoor, 1730",t:"Hawksmoor's white tower, a landmark from the river, next to the Chinese quarter."},
 {id:"bluegate",n:"Bluegate Fields",c:"china",r:1,p:[-0.0560,51.5102],y:"1860s–80s",t:"The older, poorer Chinese and lascar quarter off Ratcliff Highway in Shadwell. Its opium rooms inspired the den in Dickens's Edwin Drood (1870) and Doré's engraving of 1872. By the 1880s the Chinese were moving east to Limehouse."},
 {id:"westindia",n:"West India Docks",c:"china",r:2,p:[-0.0140,51.5073],y:"1802",t:"The docks where China-trade steamers of the Blue Funnel and other lines tie up. Their crews are the reason the Chinese quarter grows next door."},
];
BR.forEach(b=>PL.push({id:b.id,n:b.n,c:"bridge",r:b.r||2,p:b.p,y:b.y,t:b.t,a:b.a}));
const byId=Object.fromEntries(PL.map(p=>[p.id,p]));

/* ================= svg helpers ================= */
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("map"), world=document.getElementById("world");
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const f=n=>n.toFixed(1);
function smooth(ll){
  const p=ll.map(P);let d=`M${f(p[0][0])} ${f(p[0][1])}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d;
}
const poly=ll=>"M"+ll.map(P).map(q=>f(q[0])+" "+f(q[1])).join("L")+"Z";
const scaled=[]; // groups kept at constant screen size
function cs(g,x,y){g.dataset.x=x;g.dataset.y=y;scaled.push(g);return g;}
const color=c=>`var(--${c})`;

/* ================= draw ================= */
const clip=el("clipPath",{id:"clip"},el("defs",{},svg));el("rect",{width:W,height:H},clip);
const base=el("g",{"clip-path":"url(#clip)"},world);
el("rect",{width:W,height:H,class:"land"},base);
PARKS.forEach(p=>el("path",{d:poly(p.pts),class:"park"},base));
// area outlines sit under the water so they stop at the river bank
const gArea=el("g",{class:"L-areas"},base);
AREAS.forEach(a=>el("path",{d:poly(a.pts),class:"area",style:`fill:${color(a.c)};stroke:${color(a.c)}`},gArea));
const water=(d,w)=>{el("path",{d,class:"w-edge","stroke-width":w+2},base);el("path",{d,class:"w-fill","stroke-width":w},base);};
CANALS.forEach(c=>water(smooth(c.pts),c.w));
LAKES.forEach(c=>water(smooth(c.pts),c.w));
const thamesD=smooth(THAMES);water(thamesD,24);
el("path",{d:thamesD,id:"thames",fill:"none"},world);
DOCKS.forEach(([a,b,c,d])=>{const [x0,y1]=P([a,b]),[x1,y0]=P([c,d]);el("rect",{x:f(x0),y:f(y0),width:f(x1-x0),height:f(y1-y0),class:"dock"},base);});


const gRail=el("g",{class:"L-rail"},base);
RAIL.forEach(r=>el("path",{d:smooth(r.pts),class:"rail","vector-effect":"non-scaling-stroke"},gRail));

const gSt=el("g",{class:"L-streets"},base);
STREETS.forEach((s,i)=>{s.d=smooth(s.pts);el("path",{d:s.d,class:"road-e","stroke-width":s.r===1?5:4},gSt);});
STREETS.forEach((s,i)=>el("path",{d:s.d,id:"st"+i,class:"road","stroke-width":s.r===1?3.4:2.5},gSt));

// bridges: a bar across the river at each crossing
BR.forEach(b=>{
  if(b.k==="under")return;
  const [x,y]=P(b.p);let best=0,bd=1e9;
  THAMES.forEach((q,i)=>{const [qx,qy]=P(q),d=(qx-x)**2+(qy-y)**2;if(d<bd){bd=d;best=i;}});
  const a=P(THAMES[Math.max(0,best-1)]),c=P(THAMES[Math.min(THAMES.length-1,best+1)]);
  let dx=c[0]-a[0],dy=c[1]-a[1];const L=Math.hypot(dx,dy);dx/=L;dy/=L;
  const d=`M${f(x+dy*15)} ${f(y-dx*15)}L${f(x-dy*15)} ${f(y+dx*15)}`;
  el("path",{d,class:"bridge-bar","stroke-width":3.2,style:"stroke:var(--ink)"},base);
  el("path",{d,class:"bridge-bar","stroke-width":1.6,style:b.k==="rail"?"stroke:var(--rail)":b.k==="works"?"stroke:var(--china);stroke-dasharray:2 1.5":"stroke:var(--road)"},base);
});
el("rect",{width:W,height:H,class:"edge","vector-effect":"non-scaling-stroke"},world);

// labels
const gL=el("g",{},world);
const streetText=STREETS.map((s,i)=>{const t=el("text",{class:"lbl lbl-street L-streets"},gL);const tp=el("textPath",{href:"#st"+i,startOffset:"50%","text-anchor":"middle"},t);tp.textContent=s.n;return t;});
const riverText=["20%","55%","88%"].map(o=>{const t=el("text",{class:"lbl lbl-river"},gL);const tp=el("textPath",{href:"#thames",startOffset:o,"text-anchor":"middle"},t);tp.textContent="River Thames";return t;});
PARKS.forEach(p=>{if(!p.n)return;const [x,y]=P(p.l);const g=cs(el("g",{class:"z-2"},gL),x,y);el("text",{"text-anchor":"middle",dy:4,class:"lbl lbl-park"},g).textContent=p.n;});
AREAS.forEach(a=>{const [x,y]=P(a.l);const g=cs(el("g",{class:"L-areas"},gL),x,y);el("text",{"text-anchor":"middle",dy:4,class:"lbl lbl-area",style:`fill:${color(a.c)}`},g).textContent=a.n.toUpperCase();});

// places and numbered bridges
const gPl=el("g",{},world);const plEl={};
let bn=0;
PL.forEach(p=>{
  const [x,y]=P(p.p);const isB=p.c==="bridge";
  if(isB)p.no=++bn;
  const g=cs(el("g",{class:"pl"+(!isB&&p.r>1?" z-"+p.r:""),"data-id":p.id},gPl),x,y);
  el("circle",{r:14,class:"hit"},g);
  el("circle",{r:isB?12:10,class:"ring",style:`stroke:${color(p.c)}`},g);
  if(isB){el("circle",{r:8,class:"num"},g);el("text",{y:3.5,class:"numt"},g).textContent=p.no;}
  else el("circle",{r:5,class:"dotm",style:`fill:${color(p.c)}`},g);
  const left=p.a==="l",off=isB?11:8;
  el("text",{x:left?-off:off,y:4.5,"text-anchor":left?"end":"start",class:"lbl "+(isB?"lbl-bridge z-3":"lbl-place")},g).textContent=p.n;
  plEl[p.id]=g;
});

/* ================= view ================= */
const wrap=document.getElementById("mapwrap");
let vw=0,vh=0,k=1,tx=0,ty=0,lastK=-1,raf=0;
const fitK=()=>Math.min(vw/(W+30),vh/(H+30));
const clampK=v=>Math.min(14,Math.max(fitK()*0.9,v));
function schedule(){if(!raf)raf=requestAnimationFrame(apply);}
function apply(){
  raf=0;
  world.setAttribute("transform",`translate(${f(tx)} ${f(ty)}) scale(${k.toFixed(4)})`);
  if(k===lastK)return;
  const inv=(1/k).toFixed(4);
  for(const g of scaled)g.setAttribute("transform",`translate(${g.dataset.x} ${g.dataset.y}) scale(${inv})`);
  for(const t of streetText){t.style.fontSize=(10.5/k)+"px";t.style.strokeWidth=(3/k)+"px";t.setAttribute("dy",(3.5/k).toFixed(2));}
  for(const t of riverText){t.style.fontSize=(16/k)+"px";t.setAttribute("dy",(5.5/k).toFixed(2));}
  svg.classList.toggle("z2",k>=1.6);svg.classList.toggle("z3",k>=3.2);
  lastK=k;updateScale();
}
function center(x,y,kk){k=clampK(kk);tx=vw/2-x*k;ty=vh/2-y*k;schedule();}
function zoomAt(sx,sy,factor){const nk=clampK(k*factor);const wx=(sx-tx)/k,wy=(sy-ty)/k;k=nk;tx=sx-wx*k;ty=sy-wy*k;schedule();}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let flyRaf=0;
function flyTo(x,y,k1){
  cancelAnimationFrame(flyRaf);k1=clampK(k1);
  if(reduce)return center(x,y,k1);
  const k0=k,cx0=(vw/2-tx)/k,cy0=(vh/2-ty)/k,t0=performance.now();
  const step=now=>{let u=Math.min(1,(now-t0)/800);u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    k=Math.exp(Math.log(k0)+(Math.log(k1)-Math.log(k0))*u);const cx=cx0+(x-cx0)*u,cy=cy0+(y-cy0)*u;
    tx=vw/2-cx*k;ty=vh/2-cy*k;schedule();if(u<1)flyRaf=requestAnimationFrame(step);};
  flyRaf=requestAnimationFrame(step);
}
function flyBox([a,b,c,d]){const [x0,y1]=P([a,b]),[x1,y0]=P([c,d]);flyTo((x0+x1)/2,(y0+y1)/2,Math.min(vw/((x1-x0)*1.08),vh/((y1-y0)*1.08)));}
function flyPt(lonlat,kk){const [x,y]=P(lonlat);flyTo(x,y,kk);}
function updateScale(){
  const px=U_PER_MILE*k,opts=[[0.125,"1 furlong",1],[0.25,"¼ mile",2],[0.5,"½ mile",4],[1,"1 mile",4],[2,"2 miles",4]];
  const pick=opts.find(o=>o[0]*px>=60)||opts[opts.length-1];
  const bar=document.getElementById("scalebar");bar.style.width=Math.round(pick[0]*px)+"px";bar.innerHTML="<i></i>".repeat(pick[2]);
  document.getElementById("scalelbl").textContent=pick[1];
}

/* ================= dragging, pinching, zooming =================
   Listen on the map itself and capture the pointer, so a drag keeps working
   inside an embedded frame and the host page never scrolls instead. */
const ptrs=new Map();let drag=null,moved=0,downPl=null;
const local=e=>{const r=wrap.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
wrap.addEventListener("pointerdown",e=>{
  if(e.button>0||e.target.closest(".ctrls,.layers"))return;
  e.preventDefault();
  try{wrap.setPointerCapture(e.pointerId);}catch(_){}
  cancelAnimationFrame(flyRaf);
  ptrs.set(e.pointerId,local(e));
  if(ptrs.size===1){moved=0;downPl=e.target.closest(".pl");drag={p:local(e)};}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];drag={d:Math.hypot(a[0]-b[0],a[1]-b[1]),m:[(a[0]+b[0])/2,(a[1]+b[1])/2]};moved=99;}
});
wrap.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)){hover(e);return;}
  const p=local(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===1&&drag&&drag.p){
    const dx=p[0]-drag.p[0],dy=p[1]-drag.p[1];moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>4){wrap.classList.add("dragging");tip.hidden=true;}
    tx+=dx;ty+=dy;drag.p=p;schedule();
  }else if(ptrs.size===2&&drag&&drag.d){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    tx+=m[0]-drag.m[0];ty+=m[1]-drag.m[1];zoomAt(m[0],m[1],d/drag.d);drag.d=d;drag.m=m;
  }
});
const end=e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0){wrap.classList.remove("dragging");if(moved<=4&&downPl&&e.type==="pointerup")select(downPl.dataset.id,true);drag=null;downPl=null;}
  else{drag={p:[...ptrs.values()][0]};}
};
["pointerup","pointercancel","lostpointercapture"].forEach(t=>wrap.addEventListener(t,end));
wrap.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
wrap.addEventListener("dragstart",e=>e.preventDefault());
wrap.addEventListener("wheel",e=>{e.preventDefault();const [sx,sy]=local(e);const dy=e.deltaMode===1?e.deltaY*33:e.deltaY;zoomAt(sx,sy,Math.exp(-dy*0.0016));},{passive:false});
wrap.addEventListener("dblclick",e=>{if(e.target.closest(".ctrls,.layers"))return;const [sx,sy]=local(e);zoomAt(sx,sy,2);});
document.getElementById("zin").onclick=()=>zoomAt(vw/2,vh/2,1.6);
document.getElementById("zout").onclick=()=>zoomAt(vw/2,vh/2,1/1.6);
document.getElementById("zfit").onclick=()=>flyTo(W/2,H/2,fitK());
window.addEventListener("keydown",e=>{
  if(e.target.matches("input"))return;const s=80;
  const act={"+":()=>zoomAt(vw/2,vh/2,1.4),"=":()=>zoomAt(vw/2,vh/2,1.4),"-":()=>zoomAt(vw/2,vh/2,1/1.4),
    ArrowLeft:()=>{tx+=s;schedule();},ArrowRight:()=>{tx-=s;schedule();},ArrowUp:()=>{ty+=s;schedule();},ArrowDown:()=>{ty-=s;schedule();}}[e.key];
  if(act){act();e.preventDefault();}
});
const tip=document.getElementById("tip");
function hover(e){
  if(e.pointerType==="touch")return;
  const pl=e.target.closest&&e.target.closest(".pl");
  if(!pl){tip.hidden=true;return;}
  const [sx,sy]=local(e);const p=byId[pl.dataset.id];
  tip.textContent=(p.no?p.no+". ":"")+p.n;tip.style.left=sx+"px";tip.style.top=sy+"px";tip.hidden=false;
}
wrap.addEventListener("pointerleave",()=>{tip.hidden=true;});
const lyrBtn=document.getElementById("lyr"),lyrBox=document.getElementById("layers");
lyrBtn.onclick=()=>{lyrBox.hidden=!lyrBox.hidden;lyrBtn.setAttribute("aria-pressed",String(!lyrBox.hidden));};
[["L-areas","no-areas"],["L-streets","no-streets"],["L-rail","no-rail"]].forEach(([id,cls])=>{
  const cb=document.getElementById(id),sync=()=>svg.classList.toggle(cls,!cb.checked);cb.addEventListener("change",sync);sync();});

/* ================= panel ================= */
const detail=document.getElementById("detail"),list=document.getElementById("list"),q=document.getElementById("q");
let selected=null,activeCat=null;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const VIEWS={west:AREAS[0].box,lamb:AREAS[1].box,cut:AREAS[2].box,china:AREAS[3].box,bridge:[-0.2320,51.4640,-0.0500,51.5110]};
const swatch=c=>`<span class="sw" style="background:${color(c)}"></span>`;
function renderIntro(){
  detail.innerHTML=`<h2>Five areas to draw</h2>
  <p>Westminster, Lambeth, the New Cut, the Chinese quarter, and every Thames crossing, numbered from west to east. Drag to move, scroll or pinch to zoom, and tap any dot or number for a note.</p>
  <div class="areabtns">${Object.entries(CATS).map(([c,v])=>`<button class="pbtn" data-go="${c}" aria-pressed="${activeCat===c}">${swatch(c)}${esc(v.l)}</button>`).join("")}</div>`;
  detail.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const c=b.dataset.go;activeCat=activeCat===c?null:c;
    if(activeCat)flyBox(VIEWS[c]);renderIntro();renderList();dimMap();});
}
function renderDetail(p){
  detail.innerHTML=`<div class="cat">${swatch(p.c)}${esc(CATS[p.c].l)}${p.no?" · no. "+p.no:""}</div>
  <h2>${esc(p.n)}</h2><div class="meta">${esc(p.y)}</div><p>${esc(p.t)}</p>
  <button class="pbtn back" id="back">&larr; All areas</button>`;
  detail.querySelector("#back").onclick=()=>{deselect();renderIntro();};
}
function deselect(){if(selected)plEl[selected].classList.remove("sel");selected=null;markList();}
function select(id,fromMap){
  const p=byId[id];if(selected)plEl[selected].classList.remove("sel");
  selected=id;plEl[id].classList.add("sel");
  const need=p.c==="bridge"?3.4:p.r===3?3.4:p.r===2?1.8:0;
  if(!fromMap)flyPt(p.p,Math.max(k,need,2));else if(k<need)flyPt(p.p,need);
  renderDetail(p);markList();detail.scrollTop=0;
}
function matches(p){const s=q.value.trim().toLowerCase();return (!activeCat||activeCat===p.c)&&(!s||p.n.toLowerCase().includes(s)||p.t.toLowerCase().includes(s));}
function renderList(){
  let html="";
  for(const c of Object.keys(CATS)){
    const items=PL.filter(p=>p.c===c&&matches(p));if(!items.length)continue;
    if(c!=="bridge")items.sort((a,b)=>a.n.localeCompare(b.n));
    html+=`<li class="grp">${swatch(c)}${esc(CATS[c].l)}${c==="bridge"?" <em>west to east</em>":""}</li>`+
      items.map(p=>`<li><button data-id="${p.id}"><span class="no">${p.no||""}</span><span>${esc(p.n)}</span><span class="yr">${esc((p.y.match(/\d{4}/)||[""])[0])}</span></button></li>`).join("");
  }
  list.innerHTML=html||`<li class="empty">Nothing matches. Try another word.</li>`;markList();
}
function markList(){list.querySelectorAll("button[data-id]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.id===selected)));}
function dimMap(){PL.forEach(p=>plEl[p.id].classList.toggle("dim",!matches(p)));svg.classList.toggle("filtered",!!activeCat||q.value.trim()!=="");}
list.addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(b)select(b.dataset.id,false);});
q.addEventListener("input",()=>{renderList();dimMap();});

/* ================= boot ================= */
renderIntro();renderList();
new ResizeObserver(()=>{const r=wrap.getBoundingClientRect();vw=r.width;vh=r.height;schedule();}).observe(wrap);
{const r=wrap.getBoundingClientRect();vw=r.width;vh=r.height;
 const [x0,y1]=P([-0.1420,51.4870]),[x1,y0]=P([-0.0180,51.5140]);
 center((x0+x1)/2,(y0+y1)/2,Math.min(vw/((x1-x0)*1.04),vh/((y1-y0)*1.04)));}
})();
</script>
