<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>London, 1886</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --paper:#E4DFCC; --paper-2:#D6CFB6; --ink:#25232C; --ink-soft:#5E5968;
  --built:#E0C2B2; --hatch:rgba(37,35,44,.16);
  --water:#A3B9BE; --water-line:#6E8D95; --park:#B7C299; --park-ink:#6C7A4C; --marsh:#CFCBA6;
  --road:#F2EDDE; --road-case:#6A6472; --rail:#25232C; --rail-tie:#E4DFCC;
  --under:#A8352B; --accent:#A8352B; --glow:rgba(168,53,43,0);
  --panel:#ECE7D6; --panel-2:#E2DCC7; --line:rgba(37,35,44,.2);
  --fog:214,205,168;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171A; --paper-2:#0E1012; --ink:#E6D7AB; --ink-soft:#A39878;
    --built:#221E1B; --hatch:rgba(230,215,171,.07);
    --water:#1B2A31; --water-line:#3D5B66; --park:#1C261D; --park-ink:#56704A; --marsh:#20241C;
    --road:#3A3329; --road-case:#0B0C0E; --rail:#C8B687; --rail-tie:#14171A;
    --under:#E06A52; --accent:#EBAA4C; --glow:rgba(235,170,76,.5);
    --panel:#191C1F; --panel-2:#202428; --line:rgba(230,215,171,.16);
    --fog:84,84,72;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171A; --paper-2:#0E1012; --ink:#E6D7AB; --ink-soft:#A39878;
  --built:#221E1B; --hatch:rgba(230,215,171,.07);
  --water:#1B2A31; --water-line:#3D5B66; --park:#1C261D; --park-ink:#56704A; --marsh:#20241C;
  --road:#3A3329; --road-case:#0B0C0E; --rail:#C8B687; --rail-tie:#14171A;
  --under:#E06A52; --accent:#EBAA4C; --glow:rgba(235,170,76,.5);
  --panel:#191C1F; --panel-2:#202428; --line:rgba(230,215,171,.16);
  --fog:84,84,72;
  color-scheme:dark;
}

html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--paper-2);color:var(--ink);font:15px/1.55 "Libre Caslon Text",Georgia,"Times New Roman",serif;overflow:hidden}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.mapwrap{position:relative;overflow:hidden;background:var(--paper-2);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapwrap.dragging{cursor:grabbing}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#fog{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- map styling ---------- */
.land{fill:var(--built)}
.hatchfill{fill:url(#hatch)}
.marsh{fill:var(--marsh)} .marsh-h{fill:url(#reeds)}
.park{fill:var(--park);stroke:var(--park-ink);stroke-width:.6}
.park-t{fill:url(#trees)}
.w-bank{fill:none;stroke:var(--ink-soft);stroke-linecap:round;stroke-linejoin:round}
.w-fill{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.w-line{fill:none;stroke:var(--water-line);stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.dock{fill:var(--water);stroke:var(--ink-soft);stroke-width:.8}
.road-c{fill:none;stroke:var(--road-case);stroke-linecap:round;stroke-linejoin:round}
.road{fill:none;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round}
.road.new{stroke:var(--accent);opacity:.55}
.rail-c{fill:none;stroke:var(--rail);stroke-width:3.2;stroke-linejoin:round}
.rail-t{fill:none;stroke:var(--rail-tie);stroke-width:1.5;stroke-dasharray:5 5}
.und-c{fill:none;stroke:var(--under);stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
.und-t{fill:none;stroke:var(--paper);stroke-width:1.1;stroke-dasharray:2 3}
.stn{fill:var(--paper);stroke:var(--under);stroke-width:1.6}
.bridge{stroke:var(--ink);stroke-linecap:butt;fill:none}
.neat{fill:none;stroke:var(--ink)}
.tick{stroke:var(--ink);stroke-width:1}
.meridian{stroke:var(--ink);stroke-width:1;stroke-dasharray:8 4 2 4;fill:none;opacity:.7}
.cab{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:10 6}
.cab-lbl{fill:var(--accent);font:italic 12px "IM Fell English",Georgia,serif;letter-spacing:.06em}

.focus{fill:var(--accent);fill-opacity:.1;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.lbl-focus{font:13px "IM Fell English SC",Georgia,serif;letter-spacing:.24em;fill:var(--accent)}
.lbl{fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
.lbl-dist{font-family:"IM Fell English SC",Georgia,serif;letter-spacing:.22em;fill:var(--ink-soft);stroke:var(--built)}
.lbl-dist.r1{font-size:15px}
.lbl-dist.r2{font-size:11.5px;letter-spacing:.16em}
.lbl-park{font:italic 12px "IM Fell English",Georgia,serif;fill:var(--park-ink);stroke:var(--park);letter-spacing:.04em}
.lbl-water{font:italic 13px "IM Fell English",Georgia,serif;fill:var(--water-line);stroke:none;letter-spacing:.12em}
.lbl-river{font:italic 17px "IM Fell English",Georgia,serif;fill:var(--water-line);letter-spacing:.5em}
.lbl-street{font:italic 10.5px "IM Fell English",Georgia,serif;fill:var(--ink-soft);letter-spacing:.06em}
.lbl-stn{font:italic 10px "IM Fell English",Georgia,serif;fill:var(--under);stroke:var(--built)}
.lbl-tick{font:11px "IM Fell English",Georgia,serif;fill:var(--ink);stroke:var(--paper)}
.lbl-place{font:13px "IM Fell English",Georgia,serif;stroke:var(--built)}
.lbl-place.r1{font-family:"IM Fell English SC",Georgia,serif;font-size:14px;letter-spacing:.04em}

.pl{cursor:pointer}
.pl .hit{fill:transparent}
.pl .halo{fill:var(--glow)}
.pl .g{fill:var(--ink);stroke:var(--paper);stroke-width:1}
.pl .g.o{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.pl.ev .g{fill:var(--accent)}
.pl:hover .g,.pl.sel .g{fill:var(--accent)}
.pl .ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.pl.sel .ring{opacity:1;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{r:9;opacity:1}100%{r:22;opacity:0}}
.pl.dim{opacity:.22}
svg.filtered .pl:not(.dim){display:inline}
svg.filtered .pl.dim .lbl{display:none}

/* zoom tiers */
.z-r2,.z-r3,.lbl-street{display:none}
svg.z2 .z-r2{display:inline}
svg.z3 .z-r2,svg.z3 .z-r3{display:inline}
svg.z2 .lbl-street,svg.z3 .lbl-street{display:inline}

/* layer toggles */
svg.no-streets .L-streets, svg.no-rail .L-rail, svg.no-under .L-under,
svg.no-places .L-places, svg.no-focus .L-focus, svg.no-districts .L-districts, svg.no-cab .L-cab{display:none}

/* ---------- overlay chrome ---------- */
.cartouche{position:absolute;top:16px;left:16px;padding:12px 18px 12px;background:var(--panel);border:1px solid var(--ink);box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--ink);max-width:min(330px,calc(100% - 96px));pointer-events:none;text-align:center}
.cartouche .pre{font:12px "IM Fell English SC",Georgia,serif;letter-spacing:.28em;color:var(--ink-soft)}
.cartouche h1{margin:0;font:400 44px/1 "IM Fell English SC",Georgia,serif;letter-spacing:.06em;text-wrap:balance}
.cartouche .yr{font:italic 17px "IM Fell English",Georgia,serif;margin-top:2px}
.cartouche .sub{font:italic 12px/1.35 "IM Fell English",Georgia,serif;color:var(--ink-soft);margin-top:6px;border-top:1px solid var(--line);padding-top:6px}

.ctrls{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:6px}
.btn{width:38px;height:38px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--ink);cursor:pointer;font:20px/1 "IM Fell English",Georgia,serif;padding:0}
.btn:hover{background:var(--panel-2)}
.btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.5}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.btn[aria-pressed="true"] svg{stroke:var(--panel)}

.layers{position:absolute;top:16px;right:62px;width:250px;background:var(--panel);border:1px solid var(--ink);padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;z-index:3}
.layers h2{margin:0 0 4px;font:14px "IM Fell English SC",Georgia,serif;letter-spacing:.18em}
.layers label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.layers input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.sw{width:28px;height:10px;flex:none}
.fogrow{margin-top:8px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:4px}
.fogrow input{width:100%;accent-color:var(--accent)}
.fogrow .ends{display:flex;justify-content:space-between;font:italic 12px "IM Fell English",Georgia,serif;color:var(--ink-soft)}

.scale{position:absolute;left:16px;bottom:16px;background:var(--panel);border:1px solid var(--ink);padding:6px 10px 5px;pointer-events:none}
.scale .bar{height:7px;display:flex;border:1px solid var(--ink)}
.scale .bar i{flex:1;background:var(--ink)} .scale .bar i:nth-child(even){background:var(--panel)}
.scale .t{display:flex;justify-content:space-between;font:12px "IM Fell English",Georgia,serif;margin-top:2px;gap:14px}
.readout{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;background:var(--panel);border:1px solid var(--line);padding:5px 12px;font:italic 13px "IM Fell English",Georgia,serif;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.readout b{font-style:normal;font-weight:400;color:var(--accent)}
.compass{position:absolute;right:16px;bottom:16px;width:64px;height:64px;pointer-events:none}
.compass *{stroke:var(--ink)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font:13px "IM Fell English",Georgia,serif;padding:3px 8px;white-space:nowrap;transform:translate(-50%,-140%);z-index:4}

/* ---------- side panel ---------- */
.panel{background:var(--panel);border-left:1px solid var(--ink);display:flex;flex-direction:column;min-height:0}
.detail{padding:18px 20px 16px;border-bottom:1px solid var(--line);flex:none;max-height:52%;overflow:auto}
.detail .cat{display:flex;align-items:center;gap:8px;font:12px "IM Fell English SC",Georgia,serif;letter-spacing:.2em;color:var(--ink-soft)}
.detail .cat .dot{width:9px;height:9px;background:var(--ink)}
.detail .cat .dot.ev{background:var(--accent)}
.detail h2{margin:4px 0 2px;font:400 27px/1.12 "IM Fell English",Georgia,serif;text-wrap:balance}
.detail .meta{font:italic 14px "IM Fell English",Georgia,serif;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.detail p{margin:10px 0 0;max-width:62ch}
.detail .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.detail .stats div{font:italic 12px/1.3 "IM Fell English",Georgia,serif;color:var(--ink-soft)}
.detail .stats b{display:block;font:400 22px/1.1 "IM Fell English SC",Georgia,serif;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.tournav{display:flex;align-items:center;gap:8px;margin-top:14px}
.tournav .step{flex:1;text-align:center;font:italic 13px "IM Fell English",Georgia,serif;color:var(--ink-soft)}
.pbtn{border:1px solid var(--ink);background:transparent;padding:6px 12px;cursor:pointer;font:14px "IM Fell English SC",Georgia,serif;letter-spacing:.12em}
.pbtn:hover{background:var(--panel-2)}
.pbtn.solid{background:var(--ink);color:var(--panel)}
.pbtn:disabled{opacity:.35;cursor:default}

.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;padding:10px 6px 8px;cursor:pointer;font:14px "IM Fell English SC",Georgia,serif;letter-spacing:.16em;color:var(--ink-soft);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabbody{flex:1;overflow:auto;min-height:0}
.search{padding:12px 20px 8px;display:grid;gap:10px;position:sticky;top:0;background:var(--panel);z-index:1}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--paper);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;padding:2px 9px;cursor:pointer;font:italic 13px "IM Fell English",Georgia,serif;color:var(--ink-soft)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--panel-2)}
.list{list-style:none;margin:0;padding:0 0 16px}
.list li button{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 20px;cursor:pointer;display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:baseline}
.list li:first-child button{border-top:0}
.list li button:hover,.list li button[aria-current="true"]{background:var(--panel-2)}
.list .nm{font:16px "IM Fell English",Georgia,serif}
.list .yr{font:italic 13px "IM Fell English",Georgia,serif;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.list .mk{width:8px;height:8px;background:var(--ink);align-self:center}
.list .mk.ev{background:var(--accent)}
.list .dt{font:13px "IM Fell English SC",Georgia,serif;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
.list .grp{padding:14px 20px 4px;font:13px "IM Fell English SC",Georgia,serif;letter-spacing:.18em;color:var(--accent);border-top:1px solid var(--line)}
.list .grp span{font:italic 12px "IM Fell English",Georgia,serif;letter-spacing:0;color:var(--ink-soft)}
.list .grp+li button{border-top:0}
.areabtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.empty{padding:16px 20px;font-style:italic;color:var(--ink-soft)}
.sheet-toggle{display:none}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .panel{border-left:0;border-top:1px solid var(--ink);max-height:48vh}
  .panel.collapsed .tabs,.panel.collapsed .tabbody{display:none}
  .panel.collapsed .detail{max-height:none}
  .detail{max-height:none;flex:none;padding:12px 16px}
  .detail h2{font-size:22px}
  .panel{overflow:auto}
  .tabbody{overflow:visible}
  .search{padding:10px 16px 8px}
  .list li button{padding:9px 16px}
  .sheet-toggle{display:block;float:right;margin:-2px 0 0 8px}
  .cartouche{padding:8px 12px;top:12px;left:12px}
  .cartouche h1{font-size:30px}
  .cartouche .sub{display:none}
  .ctrls{top:12px;right:12px}
  .layers{top:12px;right:58px;width:min(250px,calc(100% - 74px))}
  .readout{display:none}
  .compass{width:48px;height:48px;right:12px;bottom:12px}
  .scale{left:12px;bottom:12px}
}
@media (prefers-reduced-motion:reduce){.pl.sel .ring{animation:none;opacity:1}}
</style>

<div class="app">
  <main class="mapwrap" id="mapwrap" aria-label="Map of London in 1886">
    <svg id="map" class="z2" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plan of London, 1886">
      <defs>
        <pattern id="hatch" patternUnits="userSpaceOnUse" width="3" height="3" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="3" style="stroke:var(--hatch);stroke-width:.7"/>
        </pattern>
        <pattern id="trees" patternUnits="userSpaceOnUse" width="9" height="8">
          <circle cx="2" cy="2" r=".9" style="fill:var(--park-ink);opacity:.55"/>
          <circle cx="6.5" cy="6" r=".9" style="fill:var(--park-ink);opacity:.55"/>
        </pattern>
        <pattern id="reeds" patternUnits="userSpaceOnUse" width="10" height="7">
          <path d="M2 5h4M3 5l-1-2.5M4 5V2M5 5l1-2.5" style="stroke:var(--park-ink);stroke-width:.5;fill:none;opacity:.7"/>
        </pattern>
        <clipPath id="clip"><rect id="cliprect"/></clipPath>
      </defs>
      <g id="world"></g>
    </svg>
    <canvas id="fog"></canvas>

    <div class="cartouche" aria-hidden="true">
      <div class="pre">A New Plan of</div>
      <h1>London</h1>
      <div class="yr">&amp; its Environs, 1886</div>
      <div class="sub">Westminster, Lambeth, the New Cut, the Chinese quarter &amp; every crossing of the River</div>
    </div>

    <div class="ctrls">
      <button class="btn" id="zin" aria-label="Zoom in" title="Zoom in">+</button>
      <button class="btn" id="zout" aria-label="Zoom out" title="Zoom out">&minus;</button>
      <button class="btn" id="zfit" aria-label="Show whole map" title="Show whole map"><svg viewBox="0 0 18 18"><path d="M2 6V2h4M12 2h4v4M16 12v4h-4M6 16H2v-4"/></svg></button>
      <button class="btn" id="lyr" aria-label="Layers" title="Layers &amp; fog" aria-pressed="false" aria-controls="layers"><svg viewBox="0 0 18 18"><path d="M9 2 16 6 9 10 2 6Z"/><path d="M2 9.5 9 13.5 16 9.5"/><path d="M2 13 9 17 16 13"/></svg></button>
    </div>

    <div class="layers" id="layers" hidden>
      <h2>Layers</h2>
      <label><input type="checkbox" id="L-focus" checked> <svg class="sw" viewBox="0 0 28 10"><rect x="1" y="1" width="26" height="8" style="fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-dasharray:3 2"/></svg> Focus areas</label>
      <label><input type="checkbox" id="L-places" checked> <svg class="sw" viewBox="0 0 28 10"><rect x="10" y="1" width="8" height="8" style="fill:var(--ink)"/></svg> Places of note</label>
      <label><input type="checkbox" id="L-streets" checked> <svg class="sw" viewBox="0 0 28 10"><path d="M0 5h28" style="stroke:var(--road-case);stroke-width:6"/><path d="M0 5h28" style="stroke:var(--road);stroke-width:4"/></svg> Principal streets</label>
      <label><input type="checkbox" id="L-rail" checked> <svg class="sw" viewBox="0 0 28 10"><path d="M0 5h28" style="stroke:var(--rail);stroke-width:3.2"/><path d="M0 5h28" style="stroke:var(--rail-tie);stroke-width:1.5;stroke-dasharray:5 5"/></svg> Railways</label>
      <label><input type="checkbox" id="L-under"> <svg class="sw" viewBox="0 0 28 10"><path d="M0 5h28" style="stroke:var(--under);stroke-width:3.4"/><path d="M0 5h28" style="stroke:var(--paper);stroke-width:1.1;stroke-dasharray:2 3"/></svg> Underground railways</label>
      <label><input type="checkbox" id="L-districts"> <svg class="sw" viewBox="0 0 28 10"><text x="2" y="9" style="font:10px 'IM Fell English SC',serif;fill:var(--ink-soft)">Abc</text></svg> Parishes &amp; districts</label>
      <label><input type="checkbox" id="L-cab"> <svg class="sw" viewBox="0 0 28 10"><path d="M0 5h28" style="stroke:var(--accent);stroke-width:1.4;stroke-dasharray:6 4"/></svg> Four-mile cab radius</label>
      <div class="fogrow">
        <label for="fogamt" style="cursor:default">Fog</label>
        <input type="range" id="fogamt" min="0" max="100" value="0">
        <div class="ends"><span>A clear day</span><span>A London particular</span></div>
      </div>
    </div>

    <div class="scale" id="scale"><div class="bar" id="scalebar"></div><div class="t"><span>0</span><span id="scalelbl">1 Mile</span></div></div>
    <div class="readout" id="readout">Hover the plan to measure from <b>Charing Cross</b></div>
    <svg class="compass" viewBox="-32 -32 64 64" aria-hidden="true">
      <circle r="22" style="fill:none;stroke-width:1"/>
      <circle r="19" style="fill:none;stroke-width:.5"/>
      <path d="M0-28 5 0 0 4-5 0Z" style="fill:var(--ink);stroke-width:.6"/>
      <path d="M0 28 5 0 0-4-5 0Z" style="fill:var(--panel);stroke-width:.6"/>
      <path d="M-22 0h44" style="stroke-width:.6"/>
      <text x="0" y="-24" text-anchor="middle" style="font:11px 'IM Fell English SC',serif;fill:var(--ink);stroke:var(--panel);stroke-width:3px;paint-order:stroke">N</text>
    </svg>
    <div class="tip" id="tip" hidden></div>
  </main>

  <aside class="panel" id="panel" aria-label="Gazetteer">
    <section class="detail" id="detail" aria-live="polite"></section>
    <div class="tabbody" id="tb-places">
      <div class="search">
        <input type="search" id="q" placeholder="Search bridges, streets, buildings…" aria-label="Search places" autocomplete="off">
        <div class="chips" id="chips"></div>
      </div>
      <ul class="list" id="list"></ul>
    </div>
  </aside>
</div>

<script>
(() => {
/* ================= projection ================= */
const LON0=-0.235, LON1=0.035, LAT0=51.458, LAT1=51.562, K=10000;
const COS=Math.cos(51.51*Math.PI/180);
const W=(LON1-LON0)*COS*K, H=(LAT1-LAT0)*K;

 {id:"b-hammer",n:"Hammersmith Bridge",p:[-0.2305,51.4884],k:"works",y:"1827 · rebuilding 1884–87",t:"Tierney Clark's suspension bridge, the first in London, was found unsafe after the Boat Race crowds packed onto it. It is being replaced by Bazalgette's new suspension bridge, which opens in 1887. A temporary crossing serves in the meantime."},
 {id:"b-putney",n:"Putney Bridge",p:[-0.2135,51.4668],k:"road",y:"Opened May 1886",t:"Bazalgette's new granite bridge replaces the rickety wooden one of 1729, which barges kept hitting. It is brand new in 1886. The Boat Race starts just upstream."},
 {id:"b-wands",n:"Wandsworth Bridge",p:[-0.1886,51.4652],k:"road",y:"1873",t:"A plain iron lattice bridge. It was a toll bridge until the Metropolitan Board of Works bought out the tolls in 1880."},

 {id:"b-albert",n:"Albert Bridge",p:[-0.1665,51.4829],k:"road",y:"1873",t:"R. M. Ordish's cable-stayed toll bridge, pretty but lively. Notices at each end order troops to break step when they cross."},
 {id:"b-chelsea",n:"Chelsea Bridge",p:[-0.1502,51.4847],k:"road",y:"1858",t:"A suspension bridge opened as Victoria Bridge and renamed Chelsea Bridge when people feared its weakness might reflect on the Queen. It has been toll-free since 1879."},
 {id:"b-grosv",n:"Grosvenor Railway Bridge",p:[-0.1470,51.4850],k:"rail",y:"1860, widened 1866",t:"The wide railway bridge carrying the Brighton and Chatham lines into Victoria. It was the first railway bridge across the Thames in central London."},
 {id:"b-vaux",n:"Vauxhall Bridge",p:[-0.1275,51.4882],k:"road",y:"1816",t:"Nine cast-iron arches on stone piers, the first iron bridge across the Thames in London. It links Pimlico and Millbank to Vauxhall, and will be replaced in 1906."},
 {id:"b-lambeth",n:"Lambeth Bridge",p:[-0.1234,51.4945],k:"road",y:"1862",t:"Barlow's cheap, rusting suspension bridge on the old horse-ferry crossing between Lambeth Palace and Millbank. It is steep, narrow and little used by carts."},
 {id:"b-westm",n:"Westminster Bridge",p:[-0.1218,51.5008],k:"road",y:"1862",t:"Thomas Page's seven cast-iron arches, painted green to match the Commons benches. It runs from the foot of the Clock Tower to St Thomas' Hospital and Astley's."},
 {id:"b-hung",n:"Charing Cross Railway Bridge",p:[-0.1198,51.5065],k:"rail",y:"1864",t:"The South Eastern's lattice-girder bridge into Charing Cross. It stands on the brick piers of Brunel's Hungerford footbridge, whose chains went to finish the Clifton suspension bridge. It has a footpath with a halfpenny toll, and Londoners still call it Hungerford Bridge."},
 {id:"b-water",n:"Waterloo Bridge",p:[-0.1170,51.5088],k:"road",y:"Rennie, 1817",t:"Nine granite arches with Doric columns. Canova is said to have called it the noblest bridge in the world. It is notorious for suicides: Thomas Hood's 'The Bridge of Sighs'."},
 {id:"b-blackf",n:"Blackfriars Bridge",p:[-0.1052,51.5096],k:"road",y:"Cubitt, 1869",t:"Five wrought-iron arches on granite piers. The Queen opened it on the same day as Holborn Viaduct. It links the Embankment and Queen Victoria Street to Blackfriars Road and the New Cut."},
 {id:"b-blackrly",n:"Blackfriars Railway Bridge",p:[-0.1044,51.5095],k:"rail",y:"1864",t:"The London, Chatham & Dover's first river crossing, just downstream of the road bridge, carrying trains to Ludgate Hill and Holborn Viaduct."},
 {id:"b-stpauls",n:"St Paul's Railway Bridge",p:[-0.1036,51.5094],k:"rail",y:"New in 1886",t:"A second Chatham & Dover bridge alongside the first, opened in 1886 with the new St Paul's station on the north bank. Today it is Blackfriars station's bridge."},
 {id:"b-southw",n:"Southwark Bridge",p:[-0.0945,51.5087],k:"road",y:"Rennie, 1819",t:"Three enormous cast-iron spans, known as the 'Iron Bridge' in Little Dorrit. It was a toll bridge for decades, so traffic avoided it and it is still the quietest crossing in the City."},
 {id:"b-cannon",n:"Cannon Street Railway Bridge",p:[-0.0915,51.5085],k:"rail",y:"1866",t:"The South Eastern's iron bridge into Cannon Street, whose twin towers face the river."},
 {id:"b-london",n:"London Bridge",p:[-0.0877,51.5079],k:"road",y:"Rennie, 1831",t:"Five granite arches, the busiest crossing in London, with some 20,000 vehicles a day. Below it lies the Pool of London, and ships with masts can go no further upstream."},
 {id:"b-tower",n:"Tower Bridge (building)",p:[-0.0754,51.5055],k:"works",r:1,y:"Begun 21 June 1886",t:"The Prince of Wales lays the foundation stone this summer. For now there are only cofferdams in the river: the bascules and Gothic towers will not be finished until 1894. Draw it as works in progress, or leave it out."},

const wrap=document.getElementById("mapwrap");
let vw=0,vh=0,k=1,tx=0,ty=0,lastK=-1,raf=0;
const clampK=v=>Math.min(14,Math.max(fitK()*0.85,v));
function fitK(){return Math.min(vw/(W+40),vh/(H+40));}
function resize(){const r=wrap.getBoundingClientRect();vw=r.width;vh=r.height;sizeFog();schedule();}
function schedule(){if(!raf)raf=requestAnimationFrame(apply);}
function apply(){
  raf=0;
  world.setAttribute("transform",`translate(${f(tx)} ${f(ty)}) scale(${k.toFixed(4)})`);
  if(k!==lastK){
    const inv=1/k;
    for(const g of scaled)g.setAttribute("transform",`translate(${g.dataset.x} ${g.dataset.y}) scale(${inv.toFixed(4)})`);
    const fs=(10.5/k).toFixed(3);for(const t of streetText){t.style.fontSize=fs+"px";t.style.strokeWidth=(3/k)+"px";t.setAttribute("dy",(3.5/k).toFixed(2));}
    svg.querySelectorAll(".lbl-river").forEach(t=>{t.style.fontSize=(17/k)+"px";t.style.strokeWidth=0;t.setAttribute("dy",(5/k).toFixed(2));});
    svg.classList.toggle("z2",k>=1.6);svg.classList.toggle("z3",k>=3);
    lastK=k;updateScale();
  }
  drawFog();
}
function center(lon,lat,kk){const [x,y]=P([lon,lat]);k=clampK(kk);tx=vw/2-x*k;ty=vh/2-y*k;schedule();}
function fit(){k=fitK();tx=(vw-W*k)/2;ty=(vh-H*k)/2;schedule();}
function zoomAt(sx,sy,factor){const nk=clampK(k*factor);const wx=(sx-tx)/k,wy=(sy-ty)/k;k=nk;tx=sx-wx*k;ty=sy-wy*k;schedule();}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let flyRaf=0;
function flyTo(lon,lat,kk){
  cancelAnimationFrame(flyRaf);
  const [x,y]=P([lon,lat]);const k1=clampK(kk);
  const s0={k,cx:(vw/2-tx)/k,cy:(vh/2-ty)/k};
  if(reduce){k=k1;tx=vw/2-x*k;ty=vh/2-y*k;schedule();return;}
  const t0=performance.now(),D=900;
  const step=now=>{let u=Math.min(1,(now-t0)/D);u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    const kk2=Math.exp(Math.log(s0.k)+(Math.log(k1)-Math.log(s0.k))*u);
    const cx=s0.cx+(x-s0.cx)*u,cy=s0.cy+(y-s0.cy)*u;k=kk2;tx=vw/2-cx*k;ty=vh/2-cy*k;schedule();
    if(u<1)flyRaf=requestAnimationFrame(step);};
  flyRaf=requestAnimationFrame(step);
}

/* scale bar in miles & furlongs */
function updateScale(){
  const pxMile=U_PER_MILE*k;const opts=[[0.125,"1 Furlong",1],[0.25,"2 Furlongs",2],[0.5,"½ Mile",4],[1,"1 Mile",8],[2,"2 Miles",4],[4,"4 Miles",4]];
  let pick=opts[opts.length-1];for(const o of opts){if(o[0]*pxMile>=70){pick=o;break;}}
  const w=pick[0]*pxMile;const bar=document.getElementById("scalebar");bar.style.width=w.toFixed(0)+"px";
  bar.innerHTML="<i></i>".repeat(pick[2]);document.getElementById("scalelbl").textContent=pick[1];
}

const ptrs=new Map();let drag=null,moved=0,downTarget=null;
wrap.addEventListener("pointerdown",e=>{
  if(e.target.closest(".ctrls,.layers,.btn"))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=0;downTarget=e.target.closest(".pl");drag={x:e.clientX,y:e.clientY};}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];drag={pinch:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};moved=99;}
  cancelAnimationFrame(flyRaf);
});
window.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)){hover(e);return;}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1&&drag&&!drag.pinch){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>4){wrap.classList.add("dragging");tip.hidden=true;}
    tx+=dx;ty+=dy;drag.x=e.clientX;drag.y=e.clientY;schedule();}
  else if(ptrs.size===2&&drag&&drag.pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mxx=(a.x+b.x)/2,myy=(a.y+b.y)/2;
    const r=wrap.getBoundingClientRect();tx+=mxx-drag.mx;ty+=myy-drag.my;zoomAt(mxx-r.left,myy-r.top,d/drag.pinch);drag.pinch=d;drag.mx=mxx;drag.my=myy;}
});
const up=e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0){wrap.classList.remove("dragging");if(moved<=4&&downTarget)select(downTarget.dataset.id,true);drag=null;downTarget=null;}
  else if(ptrs.size===1){const [a]=[...ptrs.values()];drag={x:a.x,y:a.y};}
};
window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
wrap.addEventListener("wheel",e=>{e.preventDefault();const r=wrap.getBoundingClientRect();const dy=e.deltaMode===1?e.deltaY*33:e.deltaY;zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-dy*0.0016));},{passive:false});
wrap.addEventListener("dblclick",e=>{if(e.target.closest(".ctrls,.layers"))return;const r=wrap.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,2);});
document.getElementById("zin").onclick=()=>zoomAt(vw/2,vh/2,1.6);
document.getElementById("zout").onclick=()=>zoomAt(vw/2,vh/2,1/1.6);
document.getElementById("zfit").onclick=()=>{if(reduce)fit();else{const c=unP(W/2,H/2);flyTo(c[0],c[1],fitK());}};
window.addEventListener("keydown",e=>{
  if(e.target.matches("input"))return;
  const s=80;
  if(e.key==="+"||e.key==="=")zoomAt(vw/2,vh/2,1.4);else if(e.key==="-")zoomAt(vw/2,vh/2,1/1.4);
  else if(e.key==="ArrowLeft"){tx+=s;schedule();}else if(e.key==="ArrowRight"){tx-=s;schedule();}
  else if(e.key==="ArrowUp"){ty+=s;schedule();}else if(e.key==="ArrowDown"){ty-=s;schedule();}
  else return;
  e.preventDefault();
});

// hover readout & tooltip
const tip=document.getElementById("tip"),readout=document.getElementById("readout");
function distFromCX(lon,lat){const dx=(lon-CHX[0])*COS*111320,dy=(lat-CHX[1])*111320;return Math.hypot(dx,dy)/1609.344;}
function fmtDist(mi){let m=Math.floor(mi),fur=Math.round((mi-m)*8);if(fur===8){m++;fur=0;}
  if(m===0&&fur===0)return "at";return (m?m+(m===1?" mile":" miles"):"")+(m&&fur?" ":"")+(fur?fur+(fur===1?" furlong":" furlongs"):"")+" from";}
function hover(e){
  const r=wrap.getBoundingClientRect();const sx=e.clientX-r.left,sy=e.clientY-r.top;
  if(sx<0||sy<0||sx>r.width||sy>r.height||e.pointerType==="touch")return;
  const [lon,lat]=unP((sx-tx)/k,(sy-ty)/k);
  if(lon<LON0||lon>LON1||lat<LAT0||lat>LAT1){readout.innerHTML="Beyond the edge of the plan";}
  else{const mi=distFromCX(lon,lat);readout.innerHTML=`${fmtDist(mi)} <b>Charing Cross</b> · ${mi<=4?"within":"beyond"} the four-mile cab radius`;}
  const pl=e.target.closest&&e.target.closest(".pl");
  if(pl){tip.textContent=byId[pl.dataset.id].n;tip.style.left=sx+"px";tip.style.top=sy+"px";tip.hidden=false;}else tip.hidden=true;
}
wrap.addEventListener("pointerleave",()=>{tip.hidden=true;});

// layers
const lyrBtn=document.getElementById("lyr"),lyrBox=document.getElementById("layers");
lyrBtn.onclick=()=>{lyrBox.hidden=!lyrBox.hidden;lyrBtn.setAttribute("aria-pressed",String(!lyrBox.hidden));};
const LAYERS={"L-focus":"no-focus","L-places":"no-places","L-streets":"no-streets","L-rail":"no-rail","L-under":"no-under","L-districts":"no-districts","L-cab":"no-cab"};
for(const id in LAYERS){const cb=document.getElementById(id);const sync=()=>svg.classList.toggle(LAYERS[id],!cb.checked);cb.addEventListener("change",sync);sync();}

/* ================= fog ================= */
const fogC=document.getElementById("fog"),fx=fogC.getContext("2d");const fogIn=document.getElementById("fogamt");
let fogAmt=+fogIn.value/100,fogT=0,fogLast=0,fogRaf=0;
const blobs=Array.from({length:70},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:60+Math.random()*140,a:.35+Math.random()*.65,s:.6+Math.random()*.8}));
const FS=0.5;
function sizeFog(){fogC.width=Math.max(1,Math.round(vw*FS));fogC.height=Math.max(1,Math.round(vh*FS));}
function fogRGB(){return getComputedStyle(document.documentElement).getPropertyValue("--fog").trim()||"214,205,168";}
let rgb=fogRGB();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{rgb=fogRGB();updateHalo();drawFog();});
new MutationObserver(()=>{rgb=fogRGB();updateHalo();drawFog();}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
function drawFog(){
  fx.clearRect(0,0,fogC.width,fogC.height);
  if(fogAmt<=0.001)return;
  fx.fillStyle=`rgba(${rgb},${(fogAmt*0.42).toFixed(3)})`;fx.fillRect(0,0,fogC.width,fogC.height);
  for(const b of blobs){
    const x=((b.x+fogT*4*b.s)%(W+300)-150)*k+tx,y=(b.y+Math.sin(fogT*.05+b.x)*20)*k+ty;
    const r=Math.max(b.r*k,90);
    if(x+r<0||y+r<0||x-r>vw||y-r>vh)continue;
    const g=fx.createRadialGradient(x*FS,y*FS,0,x*FS,y*FS,r*FS);
    const a=Math.min(.9,fogAmt*b.a*.9);
    g.addColorStop(0,`rgba(${rgb},${a.toFixed(3)})`);g.addColorStop(1,`rgba(${rgb},0)`);
    fx.fillStyle=g;fx.fillRect((x-r)*FS,(y-r)*FS,2*r*FS,2*r*FS);
  }
}
function fogLoop(now){fogRaf=0;if(fogAmt<=0.001||reduce||document.hidden)return;
  if(now-fogLast>50){fogT+=(now-fogLast)/1000*(fogLast?1:0);fogLast=now;drawFog();}
  fogRaf=requestAnimationFrame(fogLoop);}
function startFog(){if(!fogRaf&&!reduce){fogLast=0;fogRaf=requestAnimationFrame(fogLoop);}}
fogIn.addEventListener("input",()=>{fogAmt=+fogIn.value/100;drawFog();startFog();});
document.addEventListener("visibilitychange",startFog);
function updateHalo(){const dark=(getComputedStyle(document.documentElement).getPropertyValue("color-scheme")||"").includes("dark");svg.style.setProperty("--halo",dark?"1":"0");}

/* ================= panel ================= */
const detail=document.getElementById("detail"),list=document.getElementById("list"),chipsBox=document.getElementById("chips"),q=document.getElementById("q");
const panel=document.getElementById("panel");
let selected=null,activeCats=new Set();
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function flyBox([a,b,c,d]){const [x0,y1]=P([a,b]),[x1,y0]=P([c,d]);const kk=Math.min(vw/((x1-x0)*1.1),vh/((y1-y0)*1.1));flyTo((a+c)/2,(b+d)/2,kk);}
const VIEWS={west:AREAS[0].box,lamb:AREAS[1].box,cut:AREAS[2].box,china:AREAS[3].box,bridge:[-0.2320,51.4640,-0.0500,51.5110]};
function renderIntro(){
  detail.innerHTML=`<div class="cat">Reference plan · 1886</div>
  <h2>Five areas to draw</h2>
  <p>Only Westminster, Lambeth, the New Cut, the Chinese quarter and the river crossings are marked. Choose an area to jump to it, or pick any mark on the plan to read about it. Distances are measured from Charing Cross.</p>
  <div class="areabtns">${Object.entries(CATS).map(([c,v])=>`<button class="pbtn" data-go="${c}">${esc(v.l)}</button>`).join("")}</div>`;
  detail.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{flyBox(VIEWS[b.dataset.go]);activeCats=new Set([b.dataset.go]);syncChips();renderList();dimMap();});
}
function renderDetail(p){
  const mi=distFromCX(p.p[0],p.p[1]);
  detail.innerHTML=`<div class="cat"><span class="dot"></span>${esc(CATS[p.c].l)}</div>
  <h2>${esc(p.n)}</h2>
  <div class="meta">${esc(p.y)} · ${mi<0.07?"at":fmtDist(mi)} Charing Cross</div>
  <p>${esc(p.t)}</p>
  <div class="tournav"><button class="pbtn" id="back">&larr; All areas</button></div>`;
  detail.querySelector("#back").onclick=()=>{deselect();renderIntro();};
}
function deselect(){if(selected&&plEl[selected])plEl[selected].classList.remove("sel");selected=null;markLists();}
function select(id,fromMap){
  const p=byId[id];if(!p)return;
  if(selected&&plEl[selected])plEl[selected].classList.remove("sel");
  selected=id;plEl[id].classList.add("sel");
  const need=p.r===3?3.2:p.r===2?1.7:0;
  if(!fromMap)flyTo(p.p[0],p.p[1],Math.max(k,need,1.8));
  else if(k<need)flyTo(p.p[0],p.p[1],need);
  renderDetail(p);markLists();detail.scrollTop=0;
}
function syncChips(){chipsBox.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(activeCats.has(b.dataset.c))));}
function renderChips(){
  chipsBox.innerHTML=Object.entries(CATS).map(([c,v])=>`<button class="chip" data-c="${c}" aria-pressed="false">${esc(v.l)}</button>`).join("");
  chipsBox.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const c=b.dataset.c;activeCats.has(c)?activeCats.delete(c):activeCats.add(c);syncChips();renderList();dimMap();});
}
function matches(p){const s=q.value.trim().toLowerCase();return (!activeCats.size||activeCats.has(p.c))&&(!s||p.n.toLowerCase().includes(s)||p.t.toLowerCase().includes(s));}
function renderList(){
  let html="";
  for(const c of Object.keys(CATS)){
    let items=PL.filter(p=>p.c===c&&matches(p));if(!items.length)continue;
    if(c!=="bridge")items.sort((a,b)=>a.n.localeCompare(b.n));
    html+=`<li class="grp">${esc(CATS[c].l)}${c==="bridge"?" <span>upstream to downstream</span>":""}</li>`+items.map(p=>`<li><button data-id="${p.id}"><span class="mk"></span><span class="nm">${esc(p.n)}</span><span class="yr">${esc((p.y.match(/\d{4}/)||[""])[0])}</span></button></li>`).join("");
  }
  list.innerHTML=html||`<li class="empty">No places match. Try another word, or clear the areas.</li>`;
  markLists();
}
function markLists(){document.querySelectorAll(".list button[data-id]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.id===selected)));}
function dimMap(){PL.forEach(p=>plEl[p.id].classList.toggle("dim",!matches(p)));svg.classList.toggle("filtered",activeCats.size>0||q.value.trim()!=="");}
list.addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(b)select(b.dataset.id,false);});
q.addEventListener("input",()=>{renderList();dimMap();});

/* ================= boot ================= */
renderChips();renderList();renderIntro();updateHalo();
new ResizeObserver(resize).observe(wrap);
const r0=wrap.getBoundingClientRect();vw=r0.width;vh=r0.height;sizeFog();
{const [a,b,c,d]=[-0.1420,51.4870,-0.0180,51.5140];const [x0,y1]=P([a,b]),[x1,y0]=P([c,d]);center((a+c)/2,(b+d)/2,Math.min(vw/((x1-x0)*1.04),vh/((y1-y0)*1.04)));}
startFog();
})();
</script>
