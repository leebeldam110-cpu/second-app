<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>London, 1886</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap">
<style>
:root{
  --ground:#E9E4D6; --land:#F4EFE2; --ink:#2A2A33; --ink-soft:#6B6878;
  --water:#9CCBE3; --water-edge:#6FA6C4; --park:#C4DDA6; --park-edge:#9DBE7C; --park-ink:#5E7F3E; --marsh:#DCE3C4;
  --road:#FFFFFF; --road-edge:#CFC4AE; --rail:#77727F; --under:#B8453A; --tram:#2E7D5B;
  --panel:#FBF8F1; --panel-2:#F0EBDE; --line:rgba(42,42,51,.14);
  --focus:#D2691E;
  --t-gov:#6A4C9C; --t-church:#8A5A2B; --t-stage:#C2417A; --t-trade:#A7800A; --t-care:#2F7F6F;
  --t-learn:#4E7A2E; --t-industry:#5E6470; --t-hood:#C0392B; --t-station:#2A2A33; --t-bridge:#1F5F86; --t-pier:#1F5F86;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121518; --land:#1C2024; --ink:#ECE6D6; --ink-soft:#A29D90;
    --water:#23465A; --water-edge:#3A6883; --park:#27402A; --park-edge:#3C5C3E; --park-ink:#8FBF7A; --marsh:#252E24;
    --road:#3A3F45; --road-edge:#2A2E33; --rail:#8E8998; --under:#E0735F; --tram:#5CC49A;
    --panel:#181B1F; --panel-2:#22262B; --line:rgba(236,230,214,.14);
    --focus:#F0A060;
    --t-gov:#B89BEA; --t-church:#D9A36E; --t-stage:#F07AAE; --t-trade:#E6C555; --t-care:#6CCDB8;
    --t-learn:#9BCF6E; --t-industry:#A8AEB9; --t-hood:#F07A6C; --t-station:#ECE6D6; --t-bridge:#7EC4EA; --t-pier:#7EC4EA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121518; --land:#1C2024; --ink:#ECE6D6; --ink-soft:#A29D90;
  --water:#23465A; --water-edge:#3A6883; --park:#27402A; --park-edge:#3C5C3E; --park-ink:#8FBF7A; --marsh:#252E24;
  --road:#3A3F45; --road-edge:#2A2E33; --rail:#8E8998; --under:#E0735F; --tram:#5CC49A;
  --panel:#181B1F; --panel-2:#22262B; --line:rgba(236,230,214,.14);
  --focus:#F0A060;
  --t-gov:#B89BEA; --t-church:#D9A36E; --t-stage:#F07AAE; --t-trade:#E6C555; --t-care:#6CCDB8;
  --t-learn:#9BCF6E; --t-industry:#A8AEB9; --t-hood:#F07A6C; --t-station:#ECE6D6; --t-bridge:#7EC4EA; --t-pier:#7EC4EA;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif;overflow:hidden}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--t-bridge);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.mapwrap{position:relative;overflow:hidden;background:var(--ground);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain}
.mapwrap.dragging{cursor:grabbing}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- map ---------- */
.land{fill:var(--land)}
.edge{fill:none;stroke:var(--ink-soft);stroke-width:1.5}
.park{fill:var(--park);stroke:var(--park-edge);stroke-width:1}
.marsh{fill:var(--marsh)}
.w-edge{fill:none;stroke:var(--water-edge);stroke-linecap:round;stroke-linejoin:round}
.w-fill{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.dock{fill:var(--water);stroke:var(--water-edge);stroke-width:1}
.road-e{fill:none;stroke:var(--road-edge);stroke-linecap:round;stroke-linejoin:round}
.road{fill:none;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round}
.rail{fill:none;stroke:var(--rail);stroke-width:2;stroke-dasharray:7 3}
.under{fill:none;stroke:var(--under);stroke-width:2.2;stroke-dasharray:2 3;stroke-linecap:round}
.tram{fill:none;stroke:var(--tram);stroke-width:2.4;stroke-linecap:round;opacity:.85}
.area{fill:var(--focus);fill-opacity:.1;stroke:var(--focus);stroke-width:1.6;stroke-dasharray:7 5}
.bar{stroke-linecap:butt;fill:none}

text{pointer-events:none}
.lbl{paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round}
.f-focus{font:800 14px "Source Sans 3",system-ui,sans-serif;letter-spacing:.18em;fill:var(--focus)}
.f-d1{font:700 13px "Source Sans 3",system-ui,sans-serif;letter-spacing:.18em;fill:var(--ink-soft)}
.f-d2{font:600 11px "Source Sans 3",system-ui,sans-serif;letter-spacing:.12em;fill:var(--ink-soft)}
.f-park{font:italic 12px "Source Sans 3",system-ui,sans-serif;fill:var(--park-ink)}
.f-water{font:italic 12px "Source Sans 3",system-ui,sans-serif;fill:var(--water-edge)}
.f-river{font:italic 16px "Source Sans 3",system-ui,sans-serif;fill:var(--water-edge);letter-spacing:.4em;stroke:none}
.f-street{font:10.5px "Source Sans 3",system-ui,sans-serif;fill:var(--ink-soft);stroke:var(--road)}
.f-place{font:600 12.5px "Source Sans 3",system-ui,sans-serif;fill:var(--ink)}
.f-small{font:italic 11px "Source Sans 3",system-ui,sans-serif;fill:var(--ink-soft)}
.f-bridge{font:italic 600 12px "Source Sans 3",system-ui,sans-serif;fill:var(--t-bridge)}

.pl{cursor:pointer}
.pl .hit{fill:transparent}
.pl .dot{stroke:var(--land);stroke-width:1.8}
.pl .ring{fill:none;stroke:var(--ink);stroke-width:2.5;opacity:0}
.pl.sel .ring{opacity:1}
.pl .num{fill:var(--land);stroke:var(--t-bridge);stroke-width:1.8}
.pl .numt{font:700 10px "Source Sans 3",system-ui,sans-serif;fill:var(--t-bridge);text-anchor:middle}
.pl.dim{opacity:.18}

/* ---------- chrome ---------- */
.title{position:absolute;top:14px;left:14px;padding:8px 14px 9px;background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;pointer-events:none}
.title h1{margin:0;font:400 30px/1 "IM Fell English SC",Georgia,serif;letter-spacing:.05em}
.title div{font:italic 14px "IM Fell English",Georgia,serif;color:var(--ink-soft)}
.ctrls{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:4}
.btn{width:40px;height:40px;display:grid;place-items:center;background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;cursor:pointer;font-size:22px;line-height:1;padding:0}
.btn:hover{background:var(--panel-2)}
.btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.6}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.btn[aria-pressed="true"] svg{stroke:var(--panel)}
.layers{position:absolute;top:14px;right:62px;width:250px;max-height:calc(100% - 28px);overflow:auto;background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;padding:6px 14px 12px;z-index:3}
.layers h3{margin:10px 0 4px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.layers label{display:flex;align-items:center;gap:9px;cursor:pointer;padding:2px 0;font-size:14px}
.layers input{accent-color:var(--t-bridge);width:16px;height:16px;margin:0;flex:none}
.key{width:22px;height:10px;flex:none;display:grid;place-items:center}
.key i{display:block;width:10px;height:10px;border-radius:50%}
.zoomhint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 10px;font-size:13px;color:var(--ink-soft);pointer-events:none;white-space:nowrap}
.zoomhint b{color:var(--ink);font-weight:600}
.attrib{position:absolute;right:66px;bottom:14px;max-width:min(360px,calc(100% - 200px));background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:11px;line-height:1.3;color:var(--ink-soft);pointer-events:none}
.layers .osop{display:grid;gap:4px;margin:6px 0 0 31px;font-size:13px;color:var(--ink-soft)}
.layers .osop input{width:100%;height:auto}
.scale{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;padding:5px 10px 4px;pointer-events:none;font-size:12px}
.scale .bar{height:6px;display:flex;border:1px solid var(--ink)}
.scale .bar i{flex:1;background:var(--ink)} .scale .bar i:nth-child(even){background:var(--panel)}
.scale .t{display:flex;justify-content:space-between;gap:12px;margin-top:1px}
.compass{position:absolute;right:14px;bottom:14px;width:44px;height:44px;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:13px;padding:2px 8px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-150%);z-index:4}

/* ---------- panel ---------- */
.panel{background:var(--panel);border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
.detail{padding:16px 18px 14px;border-bottom:1px solid var(--line);flex:none;max-height:55%;overflow:auto}
.detail .cat{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.sw{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.detail h2{margin:4px 0 2px;font:400 26px/1.15 "IM Fell English",Georgia,serif;text-wrap:balance}
.detail .meta{font-size:14px;color:var(--ink-soft);font-style:italic}
.detail p{margin:10px 0 0}
.areabtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pbtn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--ink);border-radius:4px;background:transparent;padding:5px 11px;cursor:pointer;font-weight:600;font-size:14px}
.pbtn:hover{background:var(--panel-2)}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.back{margin-top:12px}
.tabbody{flex:1;overflow:auto;min-height:0}
.search{padding:10px 18px;position:sticky;top:0;background:var(--panel);z-index:1;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--land)}
.list{list-style:none;margin:0;padding:0 0 16px}
.list .grp{padding:14px 18px 4px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--focus)}
.list .grp em{font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-soft)}
.list button{width:100%;text-align:left;background:none;border:0;padding:6px 18px;cursor:pointer;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center}
.list button:hover,.list button[aria-current="true"]{background:var(--panel-2)}
.list .no{font-size:12px;font-weight:700;color:var(--t-bridge);text-align:center;font-variant-numeric:tabular-nums}
.list .yr{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.empty{padding:16px 18px;font-style:italic;color:var(--ink-soft)}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .panel{border-left:0;border-top:1.5px solid var(--ink);max-height:42vh;overflow:auto}
  .detail{max-height:none}
  .tabbody{overflow:visible}
  .title h1{font-size:24px}
  .title div{font-size:12px}
  .zoomhint{display:none}
  .attrib{max-width:calc(100% - 180px)}
}
</style>

  <aside class="panel" aria-label="Places">

  </aside>
</div>

 {id:"b-lambeth",n:"Lambeth Bridge",p:[-0.1234,51.4945],k:"road",y:"1862",t:"Barlow's cheap, rusting suspension bridge on the old horse-ferry crossing between Lambeth Palace and Millbank. It is steep, narrow and little used by carts."},
 {id:"b-westm",n:"Westminster Bridge",p:[-0.1218,51.5008],k:"road",y:"1862",t:"Thomas Page's seven cast-iron arches, painted green to match the Commons benches. It runs from the foot of the Clock Tower to St Thomas' Hospital and Astley's."},
 {id:"b-hung",n:"Charing Cross Railway Bridge",p:[-0.1198,51.5065],k:"rail",y:"1864",t:"The South Eastern's lattice-girder bridge into Charing Cross. It stands on the brick piers of Brunel's Hungerford footbridge, whose chains went to finish the Clifton suspension bridge. It has a footpath with a halfpenny toll, and Londoners still call it Hungerford Bridge."},
 {id:"b-water",n:"Waterloo Bridge",p:[-0.1170,51.5088],k:"road",y:"Rennie, 1817",t:"Nine granite arches with Doric columns. Canova is said to have called it the noblest bridge in the world. It is notorious for suicides: Thomas Hood's 'The Bridge of Sighs'."},
 {id:"b-blackf",n:"Blackfriars Bridge",p:[-0.1052,51.5096],k:"road",y:"Cubitt, 1869",t:"Five wrought-iron arches on granite piers. The Queen opened it on the same day as Holborn Viaduct. It links the Embankment and Queen Victoria Street to Blackfriars Road and the New Cut."},
 {id:"b-blackrly",n:"Blackfriars Railway Bridge",p:[-0.1044,51.5095],k:"rail",y:"1864",t:"The London, Chatham & Dover's first river crossing, just downstream of the road bridge, carrying trains to Ludgate Hill and Holborn Viaduct."},
 {id:"b-stpauls",n:"St Paul's Railway Bridge",p:[-0.1036,51.5094],k:"rail",y:"New in 1886",t:"A second Chatham & Dover bridge alongside the first, opened in 1886 with the new St Paul's station on the north bank. Today it is Blackfriars station's bridge."},

 {id:"westminster",n:"Palace of Westminster",ar:"west",ty:"gov",r:1,p:[-0.1250,51.4990],y:"1840–70",t:"Barry and Pugin's Gothic Houses of Parliament, with medieval Westminster Hall (1097) kept inside. On 8 June 1886 the Commons defeats Gladstone's Irish Home Rule Bill. The Victoria Tower is at the south end."},
 {id:"bigben",n:"Clock Tower (Big Ben)",ar:"west",ty:"gov",r:2,p:[-0.1245,51.5007],y:"1859",t:"'Big Ben' is properly the name of the bell. A light at the top of the tower shows when the Commons is sitting after dark."},
 {id:"abbey",n:"Westminster Abbey",ar:"west",ty:"church",r:1,a:"l",p:[-0.1277,51.4993],y:"1245–1517",t:"With St Margaret's church beside it on the north side. The Queen's Golden Jubilee service is held here the following June."},
 {id:"aquarium",n:"Royal Aquarium",ar:"west",ty:"stage",r:3,a:"l",p:[-0.1308,51.5006],y:"1876",t:"A huge glass-and-iron pleasure palace on Tothill Street opposite the Abbey, with few fish and plenty of music-hall acts, acrobats and 'human cannonballs'. It is thought rather disreputable. The site later becomes Methodist Central Hall."},
 {id:"whitehall",n:"Horse Guards",ar:"west",ty:"gov",r:2,a:"l",p:[-0.1272,51.5048],y:"1759",t:"Mounted sentries face Whitehall. The Admiralty is to the north and the Treasury to the south. Whitehall and Parliament Street are much narrower than they are today."},
 {id:"downing",n:"Downing Street",ar:"west",ty:"gov",r:3,a:"l",p:[-0.1276,51.5034],y:"1680s",t:"There are three premierships in 1886: Salisbury, then Gladstone, then Salisbury again. Number 10 is a modest brick terrace house."},
 {id:"yard",n:"Great Scotland Yard",ar:"west",ty:"gov",r:2,a:"l",p:[-0.1262,51.5063],y:"Police HQ",t:"Metropolitan Police headquarters, off the north end of Whitehall. The police move to New Scotland Yard on the Embankment in 1890."},
 {id:"trafalgar",n:"Trafalgar Square",ar:"west",ty:"gov",r:2,a:"l",p:[-0.1281,51.5080],y:"1840s",t:"Nelson's Column (1843) and Landseer's lions (1867), with the National Gallery to the north. On 8 February 1886 the unemployed rioted from here through Pall Mall. Official distances from London are measured from the Charles I statue just to the south."},
 {id:"devilsacre",n:"The Devil's Acre",ar:"west",ty:"hood",r:2,p:[-0.1335,51.4974],y:"Slum",t:"The rookery of Old Pye Street and Duck Lane, in the shadow of the Abbey. Dickens's journal gave it the name. By 1886 much of it has been replaced by blocks of 'model dwellings', but it is still poor."},
 {id:"millbank",n:"Millbank Penitentiary",ar:"west",ty:"care",r:2,p:[-0.1305,51.4905],y:"1821",t:"A vast star-shaped prison on the marshy riverbank, which convicts once passed through on their way to transportation. It closes in 1890, and the Tate Gallery is later built on the site."},
 {id:"tothill",n:"Tothill Fields",ar:"west",ty:"care",r:3,p:[-0.1395,51.4963],y:"Prison closed 1885",t:"The old Westminster house of correction has just been demolished. Cardinal Manning bought the site in 1884; Westminster Cathedral is built there from 1895."},
 {id:"lambpal",n:"Lambeth Palace",ar:"lamb",ty:"church",r:1,p:[-0.1190,51.4957],y:"13th century",t:"The Archbishop of Canterbury's London house, with Morton's red-brick Tudor gatehouse and the Lollards' Tower facing the river."},
 {id:"stmary",n:"St Mary-at-Lambeth",ar:"lamb",ty:"church",r:3,a:"l",p:[-0.1205,51.4948],y:"Medieval tower",t:"The parish church by the palace gate. Its churchyard holds the Tradescants and Captain Bligh of the Bounty."},
 {id:"stthomas",n:"St Thomas' Hospital",ar:"lamb",ty:"care",r:2,p:[-0.1182,51.4985],y:"1871",t:"Seven pavilion blocks along the new Albert Embankment, facing Parliament. Florence Nightingale's nursing school is here."},
 {id:"astley",n:"Astley's Amphitheatre",ar:"lamb",ty:"stage",r:2,p:[-0.1163,51.5008],y:"Rebuilt 1843",t:"A horse-circus theatre at the foot of Westminster Bridge, famous for equestrian spectacles and loved by Dickens. It is past its best by 1886 and is demolished in 1893."},
 {id:"canterbury",n:"Canterbury Music Hall",ar:"lamb",ty:"stage",r:2,a:"l",p:[-0.1150,51.4990],y:"1852",t:"Charles Morton's hall on Westminster Bridge Road, the prototype of the Victorian music hall."},
 {id:"necropolis",n:"Necropolis Station",ar:"lamb",ty:"station",r:3,p:[-0.1148,51.5016],y:"1854",t:"The London Necropolis Company's private station beside Waterloo, where coffins and mourners boarded funeral trains to Brookwood Cemetery in Surrey."},
 {id:"shottower",n:"Lambeth Shot Tower",ar:"lamb",ty:"industry",r:2,p:[-0.1180,51.5052],y:"1826",t:"A tall round brick tower on the riverfront, a landmark from the bridges. Molten lead dropped from the top formed lead shot. It is useful for your skyline."},
 {id:"lion",n:"Lion Brewery",ar:"lamb",ty:"industry",r:3,a:"l",p:[-0.1195,51.5038],y:"1837",t:"A riverside brewery at the south end of Hungerford Bridge, crowned by a red Coade-stone lion. The lion now stands on Westminster Bridge."},
 {id:"bethlem",n:"Bethlem Hospital (Bedlam)",ar:"lamb",ty:"care",r:2,p:[-0.1085,51.4958],y:"1815",t:"Bethlem Royal Hospital, 'Bedlam', London's ancient asylum for the insane, in its domed building on Lambeth Road in St George's Fields (here since 1815). Its criminal patients were moved to Broadmoor in the 1860s. The hospital left for Beckenham in 1930, and the building now houses the Imperial War Museum."},
 {id:"doulton",n:"Doulton's Pottery",ar:"lamb",ty:"industry",r:2,p:[-0.1212,51.4918],y:"Works rebuilt 1870s",t:"Kilns and a decorated showroom on the Albert Embankment, making stoneware sewer pipes and art pottery. Lambeth's riverfront is full of potteries, and very smoky."},
 {id:"lambwalk",n:"Lambeth Walk",ar:"lamb",ty:"trade",r:2,p:[-0.1150,51.4933],y:"Street market",t:"A costermongers' market street of barrows, gas flares and cheap shops, in the heart of working-class Lambeth."},
 {id:"workhouse",n:"Lambeth Workhouse",ar:"lamb",ty:"care",r:3,p:[-0.1060,51.4933],y:"1873",t:"The parish workhouse off Kennington Road, where the young Charlie Chaplin is admitted a decade later."},
 {id:"vauxgdns",n:"Vauxhall Gardens (site)",ar:"lamb",ty:"stage",r:3,p:[-0.1225,51.4865],y:"Closed 1859",t:"The famous pleasure gardens closed in 1859 and have been built over with streets. Only the name survives."},
 {id:"newcut",n:"The New Cut Market",ar:"cut",ty:"trade",r:1,p:[-0.1068,51.5034],y:"Street laid out c. 1820",t:"A street market running from Waterloo Road to Blackfriars Road, one of the busiest in London. On Saturday nights it is crammed with costermongers' barrows lit by naphtha flares, cheap-jacks, gin palaces, pawnshops and penny gaffs. Mayhew described it."},
 {id:"oldvic",n:"Royal Victoria Hall",ar:"cut",ty:"stage",r:2,a:"l",p:[-0.1093,51.5022],y:"1818",t:"The old Royal Coburg Theatre, now the Old Vic, at the corner of the Cut and Waterloo Road. Since 1880 Emma Cons has run it as a temperance 'coffee music hall', with cheap concerts and science lectures (the origin of Morley College)."},
 {id:"lowermarsh",n:"Lower Marsh",ar:"cut",ty:"trade",r:2,a:"l",p:[-0.1120,51.5008],y:"Street market",t:"The western continuation of the Cut behind Waterloo station: another market street, full of stalls. Lambeth Marsh was still open ground in the 1700s."},
 {id:"waterloo",n:"Waterloo Station",ar:"cut",ty:"station",r:2,p:[-0.1135,51.5035],y:"1848",t:"The South Western's muddled terminus, raised on brick arches over the old marsh. Its approach viaducts hang over Lower Marsh and the Cut."},
 {id:"surreythr",n:"Surrey Theatre",ar:"cut",ty:"stage",r:3,p:[-0.1052,51.4996],y:"Rebuilt 1865",t:"A melodrama house on Blackfriars Road just north of the obelisk at St George's Circus, at the eastern end of the Cut."},
 {id:"limecause",n:"Limehouse Causeway",ar:"china",ty:"hood",r:1,p:[-0.0290,51.5104],y:"1880s onward",t:"In the 1880s Chinese seamen and the lodging-house keepers, grocers and laundrymen who served them were settling here and in Pennyfields, near the West India Docks. It was still a small community of a few hundred at most. It became London's Chinatown by the 1890s."},
 {id:"pennyfields",n:"Pennyfields",ar:"china",ty:"hood",r:2,p:[-0.0225,51.5098],y:"1880s onward",t:"The other street of the Limehouse Chinese quarter, with boarding houses, cook-shops and a few gambling and opium rooms."},
 {id:"strangers",n:"Strangers' Home for Asiatics",ar:"china",ty:"care",r:2,p:[-0.0262,51.5115],y:"1857",t:"A hostel on West India Dock Road for stranded lascars, Chinese, Malay and African seamen, run by a missionary society."},
 {id:"stanne",n:"St Anne's, Limehouse",ar:"china",ty:"church",r:2,a:"l",p:[-0.0322,51.5117],y:"Hawksmoor, 1730",t:"Hawksmoor's white tower, a landmark from the river, next to the Chinese quarter."},
 {id:"bluegate",n:"Bluegate Fields",ar:"china",ty:"hood",r:1,p:[-0.0560,51.5102],y:"1860s–80s",t:"The older, poorer Chinese and lascar quarter off Ratcliff Highway in Shadwell. Its opium rooms inspired the den in Dickens's Edwin Drood (1870) and Doré's engraving of 1872. By the 1880s the Chinese were moving east to Limehouse."},
 {id:"westindia",n:"West India Docks",ar:"china",ty:"industry",r:2,p:[-0.0140,51.5073],y:"1802",t:"The docks where China-trade steamers of the Blue Funnel and other lines tie up. Their crews are the reason the Chinese quarter grows next door."},
 {id:"bakerst",n:"Baker Street Station",ar:"other",ty:"station",r:1,p:[-0.1575,51.5237],y:"March–April 1886",t:"In Southsea, a young doctor named Arthur Conan Doyle writes A Study in Scarlet, lodging his consulting detective at 221B Baker Street. It will appear in Beeton's Christmas Annual the following year. The Metropolitan Railway has served Baker Street since the world's first underground line opened in 1863."},
 {id:"colonial",n:"Colonial & Indian Exhibition",ar:"other",ty:"learn",r:1,p:[-0.1772,51.4990],y:"4 May 1886",t:"Opened by the Queen on the old Horticultural Society gardens in South Kensington. Courts from every corner of the Empire, an Indian palace and bazaar, and some five and a half million visitors before it closes in November."},
 {id:"stpaulsstn",n:"St Paul's Station",ar:"other",ty:"station",r:1,p:[-0.1034,51.5116],y:"10 May 1886",t:"The London, Chatham & Dover Railway opens its new City station on the north bank, reached across a new railway bridge beside the old one at Blackfriars. (It will be renamed Blackfriars in 1937.)"},
 {id:"londonhosp",n:"The London Hospital",ar:"other",ty:"care",r:2,p:[-0.0592,51.5183],y:"June 1886",t:"Joseph Merrick, exhibited as 'the Elephant Man', is brought here after being found stranded at Liverpool Street. The surgeon Frederick Treves arranges rooms for him at the back of the hospital, where he lives until 1890."},
 {id:"nichol",n:"The Old Nichol",ar:"other",ty:"hood",r:1,p:[-0.0765,51.5262],y:"1886",t:"The shipowner Charles Booth begins his inquiry into the life and labour of the people, starting in the East End. His street-by-street poverty map, coloured from black ('vicious, semi-criminal') to gold ('wealthy'), will mark this tangle of courts off Shoreditch High Street among the blackest in London."},
 {id:"buckpal",n:"Buckingham Palace",ar:"other",ty:"gov",r:1,a:"l",p:[-0.1419,51.5014],y:"Royal residence since 1837",t:"Victoria was the first sovereign to live here, but since Albert's death she keeps mostly to Windsor, Osborne and Balmoral. Her Golden Jubilee falls next year, in June 1887."},
 {id:"tower",n:"Tower of London",ar:"other",ty:"gov",r:1,p:[-0.0759,51.5081],y:"From 1078",t:"In January 1885 a Fenian bomb exploded in the White Tower on the same afternoon as two in the Palace of Westminster. The Crown Jewels are on show in the Wakefield Tower."},
 {id:"bank",n:"Bank of England",ar:"other",ty:"trade",r:1,p:[-0.0886,51.5142],y:"Soane, 1788–1833",t:"Sir John Soane's windowless curtain wall encloses the Old Lady of Threadneedle Street. Sterling is on the gold standard, and the Bank's rate moves the markets of the world."},
 {id:"courts",n:"Royal Courts of Justice",ar:"other",ty:"gov",r:2,p:[-0.1136,51.5136],y:"Opened 1882",t:"G. E. Street's vast Gothic law courts on the Strand, opened by the Queen in December 1882. Street died before it was finished, worn out, it was said, by the work."},
 {id:"somerset",n:"Somerset House",ar:"other",ty:"gov",r:3,a:"l",p:[-0.1172,51.5108],y:"Chambers, 1776–96",t:"Government offices: the Inland Revenue and the General Register Office, where every birth, marriage and death in England is recorded. The Victoria Embankment now runs along its old river frontage."},
 {id:"mansion",n:"Mansion House",ar:"other",ty:"gov",r:3,a:"l",p:[-0.0910,51.5131],y:"1752",t:"Official home of the Lord Mayor, with its own justice room and cells in the basement."},
 {id:"newgate",n:"Newgate Prison",ar:"other",ty:"care",r:2,p:[-0.1020,51.5157],y:"1782",t:"Beside the Old Bailey court. Public hangings outside its walls ended in 1868; executions now take place inside the prison, announced to the crowd by a black flag."},
 {id:"stpauls",n:"St Paul's Cathedral",ar:"other",ty:"church",r:1,p:[-0.0984,51.5138],y:"Wren, 1675–1710",t:"Wren's dome still rules the City skyline, dwarfing everything around it but the smoke. The Ludgate Hill railway viaduct cuts across the view from Fleet Street, to much complaint."},
 {id:"saviour",n:"St Saviour's, Southwark",ar:"other",ty:"church",r:3,p:[-0.0896,51.5061],y:"13th century",t:"A parish church in 1886, hemmed in by the railway viaducts into London Bridge. It will not become Southwark Cathedral until 1905."},
 {id:"oratory",n:"Brompton Oratory",ar:"other",ty:"church",r:2,p:[-0.1695,51.4970],y:"Consecrated 1884",t:"The great Italianate church of Cardinal Newman's Oratorians, newly opened. Its dome is not yet built."},
 {id:"christch",n:"Christ Church, Spitalfields",ar:"other",ty:"church",r:3,a:"l",p:[-0.0731,51.5190],y:"Hawksmoor, 1729",t:"Hawksmoor's white spire over the old Huguenot silk-weaving district, now crowded with Jewish families who have fled the Russian pogroms since 1881."},
 {id:"bevis",n:"Bevis Marks Synagogue",ar:"other",ty:"church",r:3,p:[-0.0785,51.5146],y:"1701",t:"The oldest synagogue in Britain, founded by Sephardi Jews from Spain and Portugal."},
 {id:"tabernacle",n:"Metropolitan Tabernacle",ar:"other",ty:"church",r:2,p:[-0.1005,51.4945],y:"1861",t:"Charles Spurgeon, 'the Prince of Preachers', fills its 5,000 seats twice every Sunday at the Elephant and Castle."},

function smooth(ll){
  const p=ll.map(P);let d=`M${f(p[0][0])} ${f(p[0][1])}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d;
}

   and a measured size. place() lays them out highest priority first and hides any
   that would overlap something already placed. */
const gL=el("g",{},world), gM=el("g",{},world);
const meas=document.createElement("canvas").getContext("2d");
const FONTS={focus:["800 14px",14,.18,true],d1:["700 13px",13,.18,true],d2:["600 11px",11,.12,true],park:["italic 12px",12,0],water:["italic 12px",12,0],
  street:["10.5px",10.5,0],place:["600 12.5px",12.5,0],small:["italic 11px",11,0],bridge:["italic 600 12px",12,0]};
function measure(it){const [fnt,px,ls,up]=FONTS[it.font];meas.font=`${fnt} "Source Sans 3", system-ui, sans-serif`;
  const s=up?it.text.toUpperCase():it.text;it.w=meas.measureText(s).width+ls*px*s.length;it.h=px;}
const items=[];
function textEl(parent,font,text){const up=FONTS[font][3];const t=el("text",{class:"lbl f-"+font},parent);t.textContent=up?text.toUpperCase():text;return t;}

// centred labels: focus areas, districts, parks, water
function centred(layer,font,text,lonlat,minK,prio,rot){
  const [x,y]=P(lonlat);const g=el("g",{},gL);const t=textEl(g,font,text);
  t.setAttribute("text-anchor","middle");t.setAttribute("dy",(FONTS[font][1]*0.35).toFixed(1));if(rot)t.setAttribute("transform",`rotate(${rot})`);
  items.push({kind:"c",layer,font,text,x,y,g,t,minK,prio,rot:rot||0});
}
AREAS.forEach(a=>centred("focus","focus",a.n,a.l,a.c==="lamb"||a.c==="west"?T0:T1,1000));
DISTRICTS.forEach(([n,r,lo,la])=>centred("districts",r===1?"d1":"d2",n,[lo,la],r===1?T0:T2,r===1?900:500));
PARKS.forEach(p=>{if(p.n)centred("nature","park",p.n,p.l,/Hyde|Regent|Victoria Park|Battersea|Kensington G|Greenwich/.test(p.n)?T1:T2,450);});
MARSH.forEach(m=>{if(m.n)centred("nature","park",m.n,m.l,T2,300);});
WATERLBL.forEach(([n,lo,la,rot])=>centred("nature","water",n,[lo,la],T2,260,rot));

// streets: text along the road itself
STREETS.forEach((s,i)=>{
  const t=el("text",{class:"lbl f-street"},gL);const tp=el("textPath",{href:"#st"+i,startOffset:"50%","text-anchor":"middle"},t);tp.textContent=s.n;
  const L=s.path.getTotalLength(),m=s.path.getPointAtLength(L/2),a=s.path.getPointAtLength(Math.max(0,L/2-8)),b=s.path.getPointAtLength(Math.min(L,L/2+8));
  items.push({kind:"s",layer:"streets",font:"street",text:s.n,t,x:m.x,y:m.y,L,ang:Math.atan2(b.y-a.y,b.x-a.x),minK:s.r===1?T2*0.95:s.r===2?T2*1.35:T3,prio:s.r===1?420:s.r===2?320:180});
});
// river name (on the water, never collides with land labels)
const riverText=["20%","55%","88%"].map(o=>{const t=el("text",{class:"lbl f-river"},gL);const tp=el("textPath",{href:"#thames",startOffset:o,"text-anchor":"middle"},t);tp.textContent="River Thames";return t;});

// places: a marker plus a label that may sit on any of four sides
const plEl={};let bn=0;
const PRIO={1:800,2:600,3:350};
PL.forEach(p=>{
  const [x,y]=P(p.p);const isB=p.ty==="bridge",small=p.ty==="pier";
  if(isB)p.no=++bn;
  const g=el("g",{class:"pl","data-id":p.id},gM);
  el("circle",{r:13,class:"hit"},g);
  el("circle",{r:isB?12:9,class:"ring"},g);
  if(isB){el("circle",{r:8,class:"num"},g);el("text",{y:3.5,class:"numt"},g).textContent=p.no;}
  else if(p.ty==="station"){el("circle",{r:5,style:"fill:var(--land);stroke:var(--t-station);stroke-width:2.2"},g);}
  else el("circle",{r:small?3.5:5,class:"dot",style:`fill:var(--t-${p.ty})`},g);
  const t=textEl(g,isB?"bridge":small?"small":"place",p.n);
  const minK=isB?T1:p.r===1?T1:p.r===2?T2:T3;
  items.push({kind:"p",layer:"t-"+p.ty,font:isB?"bridge":small?"small":"place",text:p.n,x,y,g,t,p,
    minK,labelK:isB?T3*0.9:minK,prio:(PRIO[p.r]||350)+(p.ar==="lamb"?60:p.ar!=="other"&&p.ar!=="bridge"?30:0),mr:isB?9:small?4:6});
  plEl[p.id]=g;
});
// underground stations: small markers, labels only when close in
const gU=lg("under",gM);
STATIONS.forEach(([n,lo,la])=>{const [x,y]=P([lo,la]);const g=el("g",{},gU);
  el("circle",{r:3,style:"fill:var(--land);stroke:var(--under);stroke-width:1.6"},g);
  const t=textEl(g,"small",n);items.push({kind:"p",layer:"under",font:"small",text:n,x,y,g,t,minK:T2,labelK:T3,prio:200,mr:4});});

items.forEach(measure);
items.sort((a,b)=>b.prio-a.prio);

/* ================= 1890s survey: load the sharper images only where and when needed ================= */
function updateOS(){
  if(!layerOn.os)return;
  const v=[-tx/k,-ty/k,(vw-tx)/k,(vh-ty)/k];
  for(const o of osImgs){
    const need=o.z===14||(o.z===15&&k>=1.6)||(o.z===16&&k>=3.2);
    const inView=o.box[0]<v[2]&&o.box[2]>v[0]&&o.box[1]<v[3]&&o.box[3]>v[1];
    o.im.style.display=need?"":"none";
    if(need&&inView&&!o.loaded){o.im.setAttribute("href","os1890s/"+o.file+".jpg");o.loaded=true;}
  }
}

/* ================= placement ================= */
let placedK=-1;
const hit=(b,list)=>{for(const o of list)if(b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1])return true;return false;};
function place(){
  placedK=k;
  const boxes=[];const pad=3;
  // 1. markers first, so no label is ever drawn across a dot
  for(const it of items){
    if(it.kind!=="p")continue;
    const vis=layerOn[it.layer]&&k>=it.minK;
    it.mOn=vis;
    if(!vis){it.g.style.display="none";continue;}
    const X=it.x*k,Y=it.y*k,r=it.mr;
    const b=[X-r,Y-r,X+r,Y+r];
    if(it.p&&it.p.ty==="bridge"&&hit(b,boxes)&&!(selected===it.p.id)){it.mOn=false;it.g.style.display="none";continue;}
    it.g.style.display="";boxes.push(b);
  }
  // 2. labels by priority
  for(const it of items){
    let show=false;
    if(it.kind==="p"){
      if(it.mOn&&k>=it.labelK){
        const X=it.x*k,Y=it.y*k,o=it.mr+3,w=it.w,h=it.h;
        const cands=[["start",o,h*.35,[X+o,Y-h*.65,X+o+w,Y+h*.4]],["end",-o,h*.35,[X-o-w,Y-h*.65,X-o,Y+h*.4]],
          ["middle",0,-o-2,[X-w/2,Y-o-2-h,X+w/2,Y-o]],["middle",0,o+h*.85,[X-w/2,Y+o,X+w/2,Y+o+h+1]]];
        for(const [anc,dx,dy,b] of cands){const bb=[b[0]-pad,b[1]-pad,b[2]+pad,b[3]+pad];
          if(!hit(bb,boxes)){boxes.push(bb);it.t.setAttribute("text-anchor",anc);it.t.setAttribute("x",dx);it.t.setAttribute("y",dy.toFixed(1));show=true;break;}}
      }
    }else if(it.kind==="c"){
      if(layerOn[it.layer]&&k>=it.minK){
        const X=it.x*k,Y=it.y*k,rad=it.rot*Math.PI/180,c=Math.abs(Math.cos(rad)),s=Math.abs(Math.sin(rad));
        const hw=(c*it.w+s*it.h)/2+pad,hh=(s*it.w+c*it.h)/2+pad,b=[X-hw,Y-hh,X+hw,Y+hh];
        if(!hit(b,boxes)){boxes.push(b);show=true;}
      }
      it.g.style.display=show?"":"none";continue;
    }else if(it.kind==="s"){
      if(layerOn.streets&&k>=it.minK&&it.L*k>it.w+30){
        const X=it.x*k,Y=it.y*k,c=Math.abs(Math.cos(it.ang)),s=Math.abs(Math.sin(it.ang));
        const hw=(c*it.w+s*it.h)/2+pad,hh=(s*it.w+c*it.h)/2+pad,b=[X-hw,Y-hh,X+hw,Y+hh];
        if(!hit(b,boxes)){boxes.push(b);show=true;}
      }
    }
    it.t.style.display=show?"":"none";
  }
}

/* ================= view ================= */
const wrap=document.getElementById("mapwrap");
let vw=0,vh=0,k=1,tx=0,ty=0,lastK=-1,raf=0,selected=null;
const fitK=()=>Math.min(vw/(W+30),vh/(H+30));
const clampK=v=>Math.min(14,Math.max(Math.min(fitK()*0.9,0.5),v));
function schedule(){if(!raf)raf=requestAnimationFrame(apply);}
const hint=document.getElementById("zoomhint"),attrib=document.getElementById("attrib");
function apply(){
  raf=0;
  world.setAttribute("transform",`translate(${f(tx)} ${f(ty)}) scale(${k.toFixed(4)})`);
  updateOS();
  if(k===lastK)return;
  const inv=(1/k).toFixed(4);
  for(const it of items)if(it.g)it.g.setAttribute("transform",`translate(${f(it.x)} ${f(it.y)}) scale(${inv})`);
  for(const it of items)if(it.kind==="s"){it.t.style.fontSize=(10.5/k)+"px";it.t.style.strokeWidth=(3/k)+"px";it.t.setAttribute("dy",(3.5/k).toFixed(2));}
  for(const t of riverText){t.style.fontSize=(16/k)+"px";t.setAttribute("dy",(5.5/k).toFixed(2));}
  lastK=k;place();updateScale();
  const tier=k>=T3?3:k>=T2?2:k>=T1?1:0;
  hint.innerHTML=`Showing <b>${TIER_NAMES[tier]}</b>${tier<3?" · zoom in for more":""}`;
}
function center(x,y,kk){k=clampK(kk);tx=vw/2-x*k;ty=vh/2-y*k;schedule();}
function zoomAt(sx,sy,factor){const nk=clampK(k*factor);const wx=(sx-tx)/k,wy=(sy-ty)/k;k=nk;tx=sx-wx*k;ty=sy-wy*k;schedule();}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let flyRaf=0;
function flyTo(x,y,k1){
  cancelAnimationFrame(flyRaf);k1=clampK(k1);
  if(reduce)return center(x,y,k1);
  const k0=k,cx0=(vw/2-tx)/k,cy0=(vh/2-ty)/k,t0=performance.now();
  const step=now=>{let u=Math.min(1,(now-t0)/800);u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    k=Math.exp(Math.log(k0)+(Math.log(k1)-Math.log(k0))*u);const cx=cx0+(x-cx0)*u,cy=cy0+(y-cy0)*u;
    tx=vw/2-cx*k;ty=vh/2-cy*k;schedule();if(u<1)flyRaf=requestAnimationFrame(step);};
  flyRaf=requestAnimationFrame(step);
}
function boxView([a,b,c,d]){const [x0,y1]=P([a,b]),[x1,y0]=P([c,d]);return [(x0+x1)/2,(y0+y1)/2,Math.min(vw/((x1-x0)*1.08),vh/((y1-y0)*1.08))];}
function updateScale(){
  const px=U_PER_MILE*k,opts=[[0.125,"1 furlong",1],[0.25,"¼ mile",2],[0.5,"½ mile",4],[1,"1 mile",4],[2,"2 miles",4]];
  const pick=opts.find(o=>o[0]*px>=60)||opts[opts.length-1];
  const bar=document.getElementById("scalebar");bar.style.width=Math.round(pick[0]*px)+"px";bar.innerHTML="<i></i>".repeat(pick[2]);
  document.getElementById("scalelbl").textContent=pick[1];
}

/* ================= dragging, pinching, zooming =================
   Listen on the map itself and capture the pointer, so a drag keeps working
   inside an embedded frame and the host page never scrolls instead. */
const ptrs=new Map();let drag=null,moved=0,downPl=null;
const local=e=>{const r=wrap.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
wrap.addEventListener("pointerdown",e=>{
  if(e.button>0||e.target.closest(".ctrls,.layers"))return;
  e.preventDefault();
  try{wrap.setPointerCapture(e.pointerId);}catch(_){}
  cancelAnimationFrame(flyRaf);
  ptrs.set(e.pointerId,local(e));
  if(ptrs.size===1){moved=0;downPl=e.target.closest(".pl");drag={p:local(e)};}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];drag={d:Math.hypot(a[0]-b[0],a[1]-b[1]),m:[(a[0]+b[0])/2,(a[1]+b[1])/2]};moved=99;}
});
wrap.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)){hover(e);return;}
  const p=local(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===1&&drag&&drag.p){
    const dx=p[0]-drag.p[0],dy=p[1]-drag.p[1];moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>4){wrap.classList.add("dragging");tip.hidden=true;}
    tx+=dx;ty+=dy;drag.p=p;schedule();
  }else if(ptrs.size===2&&drag&&drag.d){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    tx+=m[0]-drag.m[0];ty+=m[1]-drag.m[1];zoomAt(m[0],m[1],d/drag.d);drag.d=d;drag.m=m;
  }
});
const end=e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0){wrap.classList.remove("dragging");if(moved<=4&&downPl&&e.type==="pointerup")select(downPl.dataset.id,true);drag=null;downPl=null;}
  else{drag={p:[...ptrs.values()][0]};}
};
["pointerup","pointercancel","lostpointercapture"].forEach(t=>wrap.addEventListener(t,end));
wrap.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
wrap.addEventListener("dragstart",e=>e.preventDefault());
wrap.addEventListener("wheel",e=>{e.preventDefault();const [sx,sy]=local(e);const dy=e.deltaMode===1?e.deltaY*33:e.deltaY;zoomAt(sx,sy,Math.exp(-dy*0.0016));},{passive:false});
wrap.addEventListener("dblclick",e=>{if(e.target.closest(".ctrls,.layers"))return;const [sx,sy]=local(e);zoomAt(sx,sy,2);});
document.getElementById("zin").onclick=()=>zoomAt(vw/2,vh/2,1.6);
document.getElementById("zout").onclick=()=>zoomAt(vw/2,vh/2,1/1.6);
document.getElementById("zfit").onclick=()=>flyTo(W/2,H/2,fitK());
window.addEventListener("keydown",e=>{
  if(e.target.matches("input"))return;const s=80;
  const act={"+":()=>zoomAt(vw/2,vh/2,1.4),"=":()=>zoomAt(vw/2,vh/2,1.4),"-":()=>zoomAt(vw/2,vh/2,1/1.4),
    ArrowLeft:()=>{tx+=s;schedule();},ArrowRight:()=>{tx-=s;schedule();},ArrowUp:()=>{ty+=s;schedule();},ArrowDown:()=>{ty-=s;schedule();}}[e.key];
  if(act){act();e.preventDefault();}
});
const tip=document.getElementById("tip");
function hover(e){
  if(e.pointerType==="touch")return;
  const pl=e.target.closest&&e.target.closest(".pl");
  if(!pl){tip.hidden=true;return;}
  const [sx,sy]=local(e);const p=byId[pl.dataset.id];
  tip.textContent=(p.no?p.no+". ":"")+p.n;tip.style.left=sx+"px";tip.style.top=sy+"px";tip.hidden=false;
}
wrap.addEventListener("pointerleave",()=>{tip.hidden=true;});

/* ================= layers panel ================= */
const lyrBtn=document.getElementById("lyr"),lyrBox=document.getElementById("layers");
lyrBtn.onclick=()=>{lyrBox.hidden=!lyrBox.hidden;lyrBtn.setAttribute("aria-pressed",String(!lyrBox.hidden));};
const KEYLINE={rail:"stroke:var(--rail);stroke-width:2;stroke-dasharray:7 3",under:"stroke:var(--under);stroke-width:2.2;stroke-dasharray:2 3",tram:"stroke:var(--tram);stroke-width:2.4",area:"stroke:var(--focus);stroke-width:1.6;stroke-dasharray:5 3",os:"stroke:#B9A98A;stroke-width:8"};
lyrBox.innerHTML=LAYERS.map(L=>L.h?`<h3>${L.h}</h3>`:`<label><input type="checkbox" id="L-${L.id}" ${L.on?"checked":""}><span class="key">${
  L.dot?`<i style="background:var(${L.dot})"></i>`:L.line?`<svg width="22" height="10"><path d="M0 5h22" style="${KEYLINE[L.line]};fill:none"/></svg>`:""}</span>${L.l}</label>`).join("");
lyrBox.insertAdjacentHTML("beforeend",`<label class="osop" for="osop">Old map strength<input type="range" id="osop" min="20" max="100" value="85"></label>`);
const osOp=document.getElementById("osop");osOp.addEventListener("input",()=>{gOS.style.opacity=osOp.value/100;});
function syncLayers(){for(const id in layerGroups)layerGroups[id].forEach(g=>g.style.display=layerOn[id]?"":"none");riverText.forEach(t=>t.style.display=layerOn.nature?"":"none");osOp.parentNode.hidden=!layerOn.os;attrib.hidden=!layerOn.os;updateOS();place();}
LAYERS.forEach(L=>{if(!L.id)return;const cb=document.getElementById("L-"+L.id);cb.addEventListener("change",()=>{layerOn[L.id]=cb.checked;syncLayers();});});

/* ================= side panel ================= */
const detail=document.getElementById("detail"),list=document.getElementById("list"),q=document.getElementById("q");
let activeAr=null;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const VIEWS={lamb:AREAS[1].box,cut:AREAS[2].box,west:AREAS[0].box,china:AREAS[3].box,bridge:[-0.2320,51.4640,-0.0500,51.5110],other:[LON0,LAT0,LON1,LAT1]};
const ORDER=["lamb","cut","west","china","bridge","other"];
const sw=ty=>`<span class="sw" style="background:var(--t-${ty})"></span>`;
function renderIntro(){
  detail.innerHTML=`<h2>London in 1886</h2>
  <p>Zoomed right out you see only district names. Zoom in for landmarks, then streets, then everything else. Labels that would overlap are hidden until there's room. Drag to move, and tap any marker for a note. Use the layers button to choose what's shown.</p>
  <div class="areabtns">${ORDER.map(a=>`<button class="pbtn" data-go="${a}" aria-pressed="${activeAr===a}">${esc(AREA_NAMES[a])}</button>`).join("")}</div>`;
  detail.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.go;activeAr=activeAr===a?null:a;
    if(activeAr){const [x,y,kk]=boxView(VIEWS[a]);flyTo(x,y,kk);}
    renderIntro();renderList();dimMap();});
}
function renderDetail(p){
  detail.innerHTML=`<div class="cat">${sw(p.ty)}${esc(TYPES[p.ty])}${p.no?" · no. "+p.no:""}</div>
  <h2>${esc(p.n)}</h2><div class="meta">${esc(p.y)}${p.ar!=="other"&&p.ar!=="bridge"?" · "+esc(AREA_NAMES[p.ar]):""}</div><p>${esc(p.t)}</p>
  <button class="pbtn back" id="back">&larr; All areas</button>`;
  detail.querySelector("#back").onclick=()=>{deselect();renderIntro();};
}
function deselect(){if(selected)plEl[selected].classList.remove("sel");selected=null;markList();place();}
function select(id,fromMap){
  const p=byId[id],it=items.find(i=>i.p===p);
  if(!layerOn["t-"+p.ty]){layerOn["t-"+p.ty]=true;document.getElementById("L-t-"+p.ty).checked=true;syncLayers();}
  if(selected)plEl[selected].classList.remove("sel");
  selected=id;plEl[id].classList.add("sel");
  const need=it.labelK*1.05;const [x,y]=P(p.p);
  if(!fromMap)flyTo(x,y,Math.max(k,need));else if(k<need)flyTo(x,y,need);else place();
  renderDetail(p);markList();detail.scrollTop=0;detail.closest(".panel").scrollTop=0;
}
function matches(p){const s=q.value.trim().toLowerCase();return (!activeAr||activeAr===p.ar)&&(!s||p.n.toLowerCase().includes(s)||p.t.toLowerCase().includes(s));}
function renderList(){
  let html="";
  for(const a of ORDER){
    const it=PL.filter(p=>p.ar===a&&matches(p));if(!it.length)continue;
    if(a!=="bridge")it.sort((x,y)=>x.n.localeCompare(y.n));
    html+=`<li class="grp">${esc(AREA_NAMES[a])}${a==="bridge"?" <em>west to east</em>":""}</li>`+
      it.map(p=>`<li><button data-id="${p.id}"><span class="no">${p.no||sw(p.ty)}</span><span>${esc(p.n)}</span><span class="yr">${esc((p.y.match(/\d{4}/)||[""])[0])}</span></button></li>`).join("");
  }
  list.innerHTML=html||`<li class="empty">Nothing matches. Try another word.</li>`;markList();
}
function markList(){list.querySelectorAll("button[data-id]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.id===selected)));}
function dimMap(){PL.forEach(p=>plEl[p.id].classList.toggle("dim",!matches(p)));}
list.addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(b)select(b.dataset.id,false);});
q.addEventListener("input",()=>{renderList();dimMap();});

/* ================= boot ================= */
renderIntro();renderList();syncLayers();
new ResizeObserver(()=>{const r=wrap.getBoundingClientRect();vw=r.width;vh=r.height;schedule();}).observe(wrap);
{const r=wrap.getBoundingClientRect();vw=r.width;vh=r.height;const [x,y,kk]=boxView([-0.1480,51.4840,-0.0860,51.5110]);center(x,y,kk);}
// re-measure once the web fonts arrive, so label boxes match what's drawn
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{items.forEach(measure);place();});
})();
</script>
