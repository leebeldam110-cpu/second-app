<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Paper Territory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="stats">
      <span id="stat-area">0.00%</span>
      <span id="stat-kills">0 kills</span>
      <span id="stat-rank"></span>
      <span id="stat-hard" class="hard-badge" hidden>Hard mode</span>
    </div>
    <ol id="leaderboard"></ol>
  </div>

  <canvas id="minimap" class="hidden"></canvas>
  <div id="feed"></div>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1>Paper Territory</h1>
      <p class="sub">Leave your land, draw a loop, come home to claim it.<br>Own 100% of the arena to win.</p>
      <input id="name" maxlength="16" placeholder="Your name" autocomplete="off">
      <div class="skin">
        <label>Skin</label>
        <div id="colors" class="swatches"></div>
        <div id="patterns" class="patterns"></div>
      </div>
      <button id="play">Play</button>
      <button id="play-hard" class="hard">Play hard mode</button>
      <p id="best" class="best"></p>
      <p class="hint">Drag your thumb to steer &middot; Mouse or arrow keys on desktop</p>
    </div>
  </div>

  <div id="gameover" class="overlay hidden">
    <div class="panel">
      <h2 id="end-title">You died!</h2>
      <p id="new-best" class="new-best" hidden>New best!</p>
      <p id="death-reason" class="sub"></p>
      <div class="results">
        <div><span id="res-area">0%</span><label>Best territory</label></div>
        <div><span id="res-kills">0</span><label>Kills</label></div>
        <div><span id="res-time">0s</span><label>Time alive</label></div>
      </div>
      <button id="again">Play again</button>
      <button id="to-menu" class="secondary">Change skin</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
